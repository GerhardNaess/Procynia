services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-app
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: procynia
            DB_USERNAME: procynia
            DB_PASSWORD: procynia
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: default
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    web:
        image: nginx:1.27-alpine
        container_name: procynia-web
        depends_on:
            app:
                condition: service_started
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./storage:/var/www/html/storage:ro
            - ./bootstrap/cache:/var/www/html/bootstrap/cache:ro
            - ./docker/nginx:/etc/nginx/conf.d:ro
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        container_name: procynia-postgres
        environment:
            POSTGRES_DB: procynia
            POSTGRES_USER: procynia
            POSTGRES_PASSWORD: procynia
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - procynia_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U procynia -d procynia"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: procynia-redis
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - procynia_redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: procynia
            DB_USERNAME: procynia
            DB_PASSWORD: procynia
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: default
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan queue:work redis --queue=supplier-harvests,ai-requirements,default --tries=1 --timeout=0
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-scheduler
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: procynia
            DB_USERNAME: procynia
            DB_PASSWORD: procynia
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: default
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan schedule:work
        restart: unless-stopped

volumes:
    procynia_postgres_data:
    procynia_redis_data:
