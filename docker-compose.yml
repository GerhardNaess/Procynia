services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-app
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 420
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    web:
        image: nginx:1.27-alpine
        container_name: procynia-web
        depends_on:
            app:
                condition: service_started
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./storage:/var/www/html/storage:ro
            - ./bootstrap/cache:/var/www/html/bootstrap/cache:ro
            - ./docker/nginx:/etc/nginx/conf.d:ro
        restart: unless-stopped

    postgres:
        image: pgvector/pgvector:0.8.2-pg16
        container_name: procynia-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - procynia_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: procynia-redis
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - procynia_redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 420
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=supplier-harvests,supplier-lookups,default tries=3 backoff=60 timeout=120 retry_after=420'
                exec php artisan queue:work redis --queue=supplier-harvests,supplier-lookups,default --tries=3 --backoff=60 --timeout=120 --sleep=3
        restart: unless-stopped

    queue-ai-requirements:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue-ai-requirements
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 2100
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=ai-requirements tries=1 timeout=1860 retry_after=2100'
                exec php artisan queue:work redis --queue=ai-requirements --tries=1 --timeout=1860 --sleep=3
        restart: unless-stopped

    queue-enterprise-wiki:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue-enterprise-wiki
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 2100
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=enterprise-wiki tries=1 backoff=60 timeout=1860 retry_after=2100'
                exec php artisan queue:work redis --queue=enterprise-wiki --tries=1 --backoff=60 --timeout=1860 --sleep=3
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-scheduler
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Scheduler] Starting scheduler worker'
                exec php artisan schedule:work
        restart: unless-stopped

volumes:
    procynia_postgres_data:
    procynia_redis_data:
