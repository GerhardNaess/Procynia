services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-app
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 420
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    web:
        image: nginx:1.27-alpine
        container_name: procynia-web
        depends_on:
            app:
                condition: service_started
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./storage:/var/www/html/storage:ro
            - ./bootstrap/cache:/var/www/html/bootstrap/cache:ro
            - ./docker/nginx:/etc/nginx/conf.d:ro
        restart: unless-stopped

    postgres:
        image: pgvector/pgvector:0.8.2-pg16
        container_name: procynia-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - procynia_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: procynia-redis
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - procynia_redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 420
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=supplier-harvests,supplier-lookups,default tries=3 backoff=60 timeout=120 retry_after=420'
                exec php artisan queue:work redis --queue=supplier-harvests,supplier-lookups,default --tries=3 --backoff=60 --timeout=120 --sleep=3
        healthcheck:
            test: ["CMD", "php", "artisan", "ops:queue-heartbeat-status", "default"]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 120s
        restart: unless-stopped

    queue-ai-requirements:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue-ai-requirements
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 2700
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=ai-requirements tries=1 timeout=2100 retry_after=2700'
                exec php artisan queue:work redis --queue=ai-requirements --tries=1 --timeout=2100 --sleep=3
        healthcheck:
            # A single job may legitimately occupy this worker for up to --timeout=2100s (35 min)
            # before the next heartbeat job on the same queue gets a turn — retries is set well
            # above that (40 * 60s = 2400s) so a busy-but-healthy worker is never flagged
            # unhealthy mid-job; only a genuinely stuck/dead worker trips this.
            test: ["CMD", "php", "artisan", "ops:queue-heartbeat-status", "ai-requirements"]
            interval: 60s
            timeout: 10s
            retries: 40
            start_period: 180s
        restart: unless-stopped

    queue-enterprise-wiki:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue-enterprise-wiki
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 2100
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting queue worker connection=redis queues=enterprise-wiki tries=1 backoff=60 timeout=1860 retry_after=2100'
                exec php artisan queue:work redis --queue=enterprise-wiki --tries=1 --backoff=60 --timeout=1860 --sleep=3
        healthcheck:
            # Same reasoning as queue-ai-requirements: a single Wiki document flow job may
            # legitimately run for up to --timeout=1860s (31 min); retries covers 35 min so a
            # busy worker is never mistaken for a dead one.
            test: ["CMD", "php", "artisan", "ops:queue-heartbeat-status", "enterprise-wiki"]
            interval: 60s
            timeout: 10s
            retries: 35
            start_period: 180s
        restart: unless-stopped

    queue-enterprise-wiki-pages:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-queue-enterprise-wiki-pages
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
            REDIS_QUEUE_RETRY_AFTER: 480
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Queue] Starting 4 queue worker processes connection=redis queues=enterprise-wiki-pages tries=1 backoff=60 timeout=420 retry_after=480'
                trap 'kill -TERM 0' TERM INT
                for i in 1 2 3 4; do
                    php artisan queue:work redis --queue=enterprise-wiki-pages --tries=1 --backoff=60 --timeout=420 --sleep=3 &
                done
                wait
        healthcheck:
            # A single page-generation job may legitimately run for up to --timeout=420s
            # (7 min); retries covers 10 min. Four worker processes now share this queue
            # (Wiki performance analysis: page generation ran fully sequentially on one
            # worker) — the heartbeat check itself is queue-scoped, not process-scoped, so
            # it stays green as long as ANY of the four processes keeps consuming the queue.
            test: ["CMD", "php", "artisan", "ops:queue-heartbeat-status", "enterprise-wiki-pages"]
            interval: 60s
            timeout: 10s
            retries: 10
            start_period: 120s
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: procynia-scheduler
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            SESSION_CONNECTION: default
            SESSION_STORE: redis
            QUEUE_CONNECTION: redis
            LOG_CHANNEL: stack
            LOG_STACK: single
            TZ: Europe/Oslo
        volumes:
            - ./:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            - /bin/sh
            - -lc
            - |
                printf '%s\n' '[Procynia][Scheduler] Starting scheduler worker'
                exec php artisan schedule:work
        healthcheck:
            test: ["CMD", "php", "artisan", "ops:scheduler-heartbeat-status"]
            interval: 60s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: unless-stopped

volumes:
    procynia_postgres_data:
    procynia_redis_data:
