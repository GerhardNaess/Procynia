; Procynia php-fpm pool, production.
;
; The one setting that matters most here is clear_env = no.
;
; php-fpm clears the environment of its worker processes by default. Under Docker Compose that went
; unnoticed because every value also lived in a .env file. In Azure Container Apps there is no .env:
; DB_HOST, REDIS_URL, APP_KEY and the rest arrive purely as container environment variables. With
; clear_env at its default, the PHP workers would see none of them and the application would boot
; against config defaults — pointing at 127.0.0.1 — instead of at the managed services.

[www]
user = www-data
group = www-data

; nginx runs in the same container, so the socket never leaves it.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Pass the container environment through to the PHP workers. See the note above.
clear_env = no

; Worker output and errors belong on the container log stream.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; php-fpm's own access log is redundant next to the nginx access log.
access.log = /dev/null
