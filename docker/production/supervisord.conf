; Procynia web container process manager.
;
; nginx and php-fpm both have to run, and a container has one PID 1. A shell wrapper with a trap
; would work until one of the two died silently; supervisord restarts it and, more importantly,
; propagates SIGTERM to both children so Container Apps gets a graceful shutdown rather than a kill.
;
; Everything logs to the container's stdout/stderr — there is no persistent disk to log to.

[supervisord]
nodaemon = true
user = root
; With nodaemon = true supervisord already writes its own messages to the console. Pointing logfile
; at /dev/stdout as well makes every supervisor line appear twice in `docker logs`, so it is sent to
; /dev/null instead. The child processes still log to stdout/stderr in their own right.
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart = true
autorestart = true
startsecs = 2
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm treats SIGQUIT as "finish current requests, then exit".
stopsignal = QUIT
stopwaitsecs = 30

[program:nginx]
command = /usr/sbin/nginx -c /etc/nginx/nginx.conf
autostart = true
autorestart = true
startsecs = 2
; Started after php-fpm so the first request cannot arrive before the upstream exists.
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; nginx treats SIGQUIT as a graceful shutdown; SIGTERM is the abrupt one.
stopsignal = QUIT
stopwaitsecs = 30

; If either process exits for good, the container should die so the platform can replace it, rather
; than sit there half-working and still passing a TCP probe.
[eventlistener:process-exit]
command = sh -c "printf 'READY\\n'; while read -r line; do echo \"[Procynia][web] supervisord: $line\" >&2; kill -TERM 1; done"
events = PROCESS_STATE_FATAL
