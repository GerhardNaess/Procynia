# Procynia production nginx.
#
# Differences from docker/nginx/default.conf, which is the Compose development config:
#
#   * listens on 8080, the port Azure Container Apps ingress targets
#   * fastcgi_pass goes to 127.0.0.1:9000, not to a Compose service name — php-fpm runs in this same
#     container, so there is no service discovery involved and no Docker DNS resolver
#   * access and error logs go to stdout/stderr instead of files
#   * runs in the foreground under supervisord

user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Must stay at or above PHP post_max_size, which must stay above the 20 MB application limit.
    # See docs/azure-runtime-contract.md for the full chain.
    client_max_body_size 50m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long-running requests must not be cut off by the proxy before PHP is done.
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Laravel's health endpoint, and the target of the Container Apps liveness/readiness probes.
        # Kept out of the access log so probe traffic does not drown the real requests.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location /storage/ {
            alias /var/www/html/storage/app/public/;
            try_files $uri $uri/ =404;
        }

        location ~ ^/build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # Forwarding headers are normalised so PHP never sees a value the caller alone chose.
            # $proxy_add_x_forwarded_for appends the peer this server actually accepted the
            # connection from — the Container Apps ingress — to whatever arrived, so the rightmost
            # entry is always observed rather than asserted. X-Real-IP carries no chain and is
            # overwritten outright.
            #
            # Laravel decides which entry to believe via
            # config('procynia.security.trusted_proxies'). That list must be set to the Container
            # Apps ingress range before this image serves production traffic; until then Laravel
            # trusts nothing and every request resolves to the ingress address. See
            # docs/operations/security.md — the range is not yet verified and must not be guessed.
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;

            # Container Apps ingress terminates TLS, so tell PHP the original scheme. Ingress is the
            # only route to this port, and it overwrites X-Forwarded-Proto on the way in.
            fastcgi_param HTTPS $http_x_forwarded_proto;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
