; Procynia production PHP settings.
;
; Deliberately different from docker/php/conf.d/local.ini, which is the development profile:
;   * display_errors is off — errors go to the log stream, never to an HTTP response
;   * opcache is enabled with validate_timestamps=0, because the code in the image never changes
;
; Upload limits are kept identical to development on purpose. The application validators cap uploads
; at 20 MB (see WikiSourceController / KnowledgeBaseController), and PHP must stay above that so a
; too-large file produces a validation message rather than a truncated request.

display_errors=Off
display_startup_errors=Off
error_reporting=E_ALL
log_errors=On
error_log=/dev/stderr

memory_limit=512M
max_execution_time=0
max_input_time=300

upload_max_filesize=50M
post_max_size=50M

date.timezone=Europe/Oslo
expose_php=Off

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The application code is immutable inside the image, so opcache never has to stat files.
opcache.validate_timestamps=0
