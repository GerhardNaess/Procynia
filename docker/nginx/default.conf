server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Forwarding headers are normalised here so PHP never sees a value the client alone chose.
        #
        # $proxy_add_x_forwarded_for appends the peer nginx actually accepted the connection from to
        # whatever X-Forwarded-For arrived. It appends rather than overwrites on purpose: in the
        # on-prem topology the host reverse proxy has already put the real client address in this
        # header, and overwriting would discard it. Appending keeps the chain intact and guarantees
        # the rightmost entry is observed by nginx, not asserted by the caller.
        #
        # X-Real-IP is overwritten outright — it carries no chain, so a client-supplied value has no
        # legitimate meaning here.
        #
        # Laravel decides which of these entries to believe via
        # config('procynia.security.trusted_proxies'), which is empty by default.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
