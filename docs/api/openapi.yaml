        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    entraApplicationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Microsoft Entra ID v2.0 access token for the Procynia API, obtained with the OAuth 2.0
        client credentials flow (scope `<Procynia API application ID URI>/.default`). Application
        mode only. The required app roles are listed per operation: `Procynia.Read.All` for every
        route, and also `Procynia.Write.All` for write operations.

        Any failure to validate the token is 401 with `WWW-Authenticate: Bearer`, whatever the
        reason. A valid application token without the required app role, or a delegated token, is
        403.

  parameters:
    ProcyniaCustomer:
      name: Procynia-Customer
      in: header
      required: true
      description: |
        The id of the customer the request is for. It selects among the active customer grants of
        the calling client and grants nothing by itself. A missing or malformed value, a customer
        without an active grant, an inactive customer and an inactive integration identity all give
        the same 403.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,17}$'
      example: '42'
    RiskId:
      name: riskId
      in: path
      required: true
      description: The risk's id.
      schema:
        type: integer
        minimum: 0
    CaseId:
      name: caseId
      in: path
      required: true
      description: The case's id.
      schema:
        type: integer
        minimum: 0
    ImprovementCaseStatusFilter:
      name: status
      in: query
      required: false
      description: Only cases with this status.
      schema:
        $ref: '#/components/schemas/ImprovementCaseStatus'
    ImprovementCaseOverdue:
      name: overdue
      in: query
      required: false
      description: |
        `true`: only active cases (open or in progress) whose frist is before today.
        `false`: all others.
      schema:
        type: string
        enum: ['true', 'false']
    ObjectiveId:
      name: objectiveId
      in: path
      required: true
      description: The objective's id.
      schema:
        type: integer
        minimum: 0
    KpiId:
      name: kpiId
      in: path
      required: true
      description: The KPI's id.
      schema:
        type: integer
        minimum: 0
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: The review's id.
      schema:
        type: integer
        minimum: 0
    ManagementReviewStatusFilter:
      name: status
      in: query
      required: false
      description: Only reviews with this status.
      schema:
        $ref: '#/components/schemas/ManagementReviewStatus'
    RequirementId:
      name: requirementId
      in: path
      required: true
      description: The requirement's id.
      schema:
        type: integer
        minimum: 0
    AuditId:
      name: auditId
      in: path
      required: true
      description: The audit's id.
      schema:
        type: integer
        minimum: 0
    FrameworkId:
      name: frameworkId
      in: path
      required: true
      description: The standard's id.
      schema:
        type: integer
        minimum: 0
    ComplianceRequirementStatusFilter:
      name: status
      in: query
      required: false
      description: Only requirements with this status.
      schema:
        $ref: '#/components/schemas/ComplianceRequirementStatus'
    ComplianceSourceId:
      name: source_id
      in: query
      required: false
      description: Only requirements of this source. A source the caller cannot see gives an empty list.
      schema:
        type: integer
        minimum: 1
    ComplianceApplicabilityFilter:
      name: applicability
      in: query
      required: false
      description: Only library requirements with this relevance (Relevans or Kontrollvalg).
      schema:
        $ref: '#/components/schemas/ComplianceApplicability'
    ComplianceAuditStatusFilter:
      name: status
      in: query
      required: false
      description: Only audits with this status.
      schema:
        $ref: '#/components/schemas/ComplianceAuditStatus'
    ComplianceAuditTypeFilter:
      name: audit_type
      in: query
      required: false
      description: Only audits of this type.
      schema:
        $ref: '#/components/schemas/ComplianceAuditType'
    BusinessAreaId:
      name: business_area_id
      in: query
      required: false
      description: Only records in this fagområde. An id the caller cannot see gives an empty list, not an error.
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `meta.next_cursor` from the previous page. Opaque: it carries no customer and no filter, so
        send the same filters with it. A value Procynia did not issue is 422.
      schema:
        type: string
        maxLength: 200

  headers:
    XRequestId:
      description: The request's correlation id, the same as `meta.request_id` or `error.request_id`.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: |
        No token, or a token that does not identify an accepted, enabled client application. The
        response never says which check failed.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            const: Bearer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: unauthenticated, message: Authentication is required., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    Forbidden:
      description: |
        The client is known, but this request is not one it may make: a delegated token, a missing
        app role, no active grant for the customer, a module the customer has not ordered, a
        missing permission, or a write operation not allowed for the grant. Every 403 reads the same.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: forbidden, message: The request is not permitted., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    NotFound:
      description: |
        The record does not exist or is not visible to the caller (another customer, or outside its
        fagområder). The two are indistinguishable. Also the answer for an unknown path under /api.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: not_found, message: The resource was not found., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    ValidationFailed:
      description: A query parameter or body field is invalid. `error.fields` names each one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error:
              code: validation_failed
              message: The request is invalid.
              request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A
              fields:
                limit: [The limit field must not be greater than 200.]
    RateLimited:
      description: More requests than allowed per minute for this (client, customer).
      headers:
        Retry-After:
          description: Seconds until a new request is accepted.
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: An unexpected error. The response never contains the internal error message.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Microsoft Entra ID's signing keys could not be fetched, so the token could not be checked. Retry later.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Meta:
      type: object
      required: [as_of, request_id]
      additionalProperties: false
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: When the answer was computed.
        request_id:
          type: string
          description: The request's correlation id, also in `X-Request-Id`.
    PageMeta:
      type: object
      required: [as_of, request_id, limit, next_cursor]
      additionalProperties: false
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: When the answer was computed.
        request_id:
          type: string
          description: The request's correlation id, also in `X-Request-Id`.
        limit:
          type: integer
          description: The page size used.
        next_cursor:
          type: [string, 'null']
          description: Send as `cursor` for the next page. Null on the last page.

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO 8601, to the second, with a `Z` suffix.
      examples: ['2026-10-24T08:15:00Z']

    ErrorCode:
      type: string
      description: |
        A stable code per HTTP status: 400 `bad_request`, 401 `unauthenticated`, 403 `forbidden`,
        404 `not_found`, 405 `method_not_allowed`, 409 `conflict`, 422 `validation_failed`, 429
        `rate_limited`, 503 `service_unavailable`. Any other 4xx is `request_error`, any other 5xx
        `server_error`. The operations in this version can return the codes their responses list,
        plus `not_found` for an unknown path and `method_not_allowed` (with `Allow`) for a wrong
        method.
      enum: [unauthenticated, forbidden, not_found, method_not_allowed, conflict, validation_failed, rate_limited, bad_request, request_error, service_unavailable, server_error]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A fixed English sentence per code. Never the internal reason. Do not parse it; use `code`.
            request_id:
              type: string
              description: The request's correlation id, also in `X-Request-Id`. Quote it when reporting a problem.
    ValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id, fields]
          additionalProperties: false
          properties:
            code:
              type: string
              const: validation_failed
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              description: |
                Per invalid request field, its messages. The field names are stable; the messages
                are human-readable and may change.
              additionalProperties:
                type: array
                items:
                  type: string

    Reference:
      type: object
      description: A record referred to by id and name.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']
    Person:
      type: object
      description: A person (a user of the customer), by id and name.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']

    Me:
      type: object
      required: [client, customer, mode, actor, modules]
      additionalProperties: false
      properties:
        client:
          type: object
          description: The calling client application as registered in Procynia.
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
        customer:
          type: object
          description: The customer selected by `Procynia-Customer`.
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
        mode:
          type: string
          const: application
          description: Application mode. Delegated mode (acting for a person) is not offered.
        actor:
          type: object
          description: The integration identity of the grant, which every request runs as.
          required: [id, name, type]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
            type:
              type: string
              const: integration
        modules:
          type: object
          description: The modules this API serves, by the key of their endpoints.
          required: [risk, deviations, objectives, management_review, compliance]
          additionalProperties: false
          properties:
            risk:
              $ref: '#/components/schemas/ModuleAccess'
              description: Risiko — `GET /v1/risks`.
            deviations:
              $ref: '#/components/schemas/ModuleAccess'
              description: Avvik og forbedringer — `GET /v1/deviations` and `GET /v1/improvements`, which read the same module with the same permission.
            objectives:
              $ref: '#/components/schemas/ModuleAccess'
              description: Mål og KPI — `GET /v1/objectives` and `GET /v1/kpis`.
            management_review:
              $ref: '#/components/schemas/ModuleAccess'
              description: Ledelsens gjennomgang — `GET /v1/management-reviews`. Customer-wide, so `business_areas` is null.
            compliance:
              $ref: '#/components/schemas/ModuleAccess'
              description: Etterlevelse og revisjon — `GET /v1/compliance/…`. Customer-wide, so `business_areas` is null.
    ModuleAccess:
      type: object
      required: [entitled, readable, business_areas]
      additionalProperties: false
      properties:
        entitled:
          type: boolean
          description: The customer has ordered the module.
        readable:
          type: boolean
          description: The module is ordered and the integration identity may read it.
        business_areas:
          description: |
            The fagområder the identity reads in: `"all"` when it reaches every fagområde, otherwise
            the list. Empty when the module is not readable. Null for a module without fagområder,
            which is read across the whole customer.
          oneOf:
            - type: 'null'
            - type: string
              const: all
            - type: array
              items:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  name:
                    type: string

    ApiModule:
      type: string
      description: A module with fagområder, by the key `/v1/me` uses. `deviations` covers both avvik and forbedringer.
      enum: [risk, deviations, objectives]
    AttentionItemType:
      type: string
      enum: [risk, deviation, improvement, objective, kpi, compliance_requirement, compliance_audit]
    AttentionOverview:
      type: object
      required: [modules, items]
      additionalProperties: false
      properties:
        modules:
          type: object
          description: Per module, whether the identity reads it. A module that is `false` contributes no items.
          required: [risk, deviations, objectives, compliance]
          additionalProperties: false
          properties:
            risk:
              type: boolean
            deviations:
              type: boolean
            objectives:
              type: boolean
            compliance:
              type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttentionItem'
    AttentionItem:
      type: object
      required: [type, id, title, objective_id, business_area, attention]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/AttentionItemType'
        id:
          type: integer
          description: The record's id in its own endpoints.
        title:
          type: string
          description: Written by people. May contain personal data, in avvik most of all.
        objective_id:
          type: [integer, 'null']
          description: A KPI's objective. Null for every other type.
        business_area:
          description: The record's fagområde (a KPI's is its objective's). Null in a module without fagområder.
          oneOf:
            - $ref: '#/components/schemas/Reference'
            - type: 'null'
        attention:
          type: array
          description: The codes of the record's own module, in that module's order.
          minItems: 1
          items:
            anyOf:
              - $ref: '#/components/schemas/RiskAttentionCode'
              - $ref: '#/components/schemas/ImprovementAttentionCode'
              - $ref: '#/components/schemas/ObjectiveAttentionCode'
              - $ref: '#/components/schemas/KpiAttentionCode'
              - $ref: '#/components/schemas/ComplianceRequirementAttentionCode'
              - $ref: '#/components/schemas/ComplianceAuditAttentionCode'
    BusinessArea:
      type: object
      description: A fagområde. Its description is not included.
      required: [id, name, modules]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        modules:
          type: array
          description: The modules the identity reads in this fagområde.
          minItems: 1
          items:
            $ref: '#/components/schemas/ApiModule'

    RiskStatus:
      type: string
      enum: [identified, in_treatment, monitored, closed]
    RiskTreatmentStrategy:
      type: string
      description: Behandlingsvalg. The chosen direction only; it is not an acceptance of the risk.
      enum: [avoid, reduce, share, accept]
    RiskLevel:
      type: string
      enum: [low, moderate, high, very_high]
    RiskAttentionCode:
      type: string
      description: |
        Why a risk that is not closed needs attention, in this order: high or very high residual
        risk, never assessed, the latest assessment has no residual risk, the periodic review is
        overdue, the acceptance of residual risk has expired, a tiltak is past its frist.
      enum: [high_residual, not_assessed, residual_not_assessed, review_overdue, acceptance_expired, actions_overdue]
    RiskScore:
      type: object
      description: |
        Likelihood and consequence on a 1–5 scale, score = likelihood × consequence, and the level
        by score band (1–4 low, 5–9 moderate, 10–16 high, 17–25 very high).
      required: [likelihood, consequence, score, level]
      additionalProperties: false
      properties:
        likelihood:
          type: integer
          minimum: 1
          maximum: 5
        consequence:
          type: integer
          minimum: 1
          maximum: 5
        score:
          type: integer
          minimum: 1
          maximum: 25
        level:
          $ref: '#/components/schemas/RiskLevel'
    Risk:
      description: |
        A risk, structured fields only. Not included: årsak, hendelse, konsekvens, utfyllende
        informasjon, begrunnelser and other free text.
      allOf:
        - $ref: '#/components/schemas/RiskFields'
      unevaluatedProperties: false
    RiskFields:
      type: object
      description: The fields of a risk in the register, shared by Risk and RiskDetail.
      required: [id, title, status, treatment_strategy, business_area, owner, inherent, residual, last_assessed_on, review_interval_months, next_review_on, is_review_overdue, attention, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskStatus'
        treatment_strategy:
          description: Null when no behandlingsvalg has been made.
          oneOf:
            - $ref: '#/components/schemas/RiskTreatmentStrategy'
            - type: 'null'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The risk's fagområde.
        owner:
          description: The risk owner, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        inherent:
          description: Inherent risk from the latest assessment. Null when the risk has never been assessed.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
        residual:
          description: Residual risk from the latest assessment. Null when that assessment has no residual risk, or the risk has never been assessed.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
        last_assessed_on:
          type: [string, 'null']
          format: date
          description: The date of the latest assessment.
        review_interval_months:
          description: The periodic review interval, or null for no fixed cycle.
          oneOf:
            - type: integer
              enum: [1, 3, 6, 12]
            - type: 'null'
        next_review_on:
          type: [string, 'null']
          format: date
          description: When the next periodic review is due.
        is_review_overdue:
          type: boolean
        attention:
          type: array
          description: Empty for a closed risk.
          items:
            $ref: '#/components/schemas/RiskAttentionCode'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    RiskDetail:
      description: |
        A risk with its history and follow-up. Not included: rationales, tiltak results, who
        assessed, accepted or revoked, and the Kvalitet links.
      allOf:
        - $ref: '#/components/schemas/RiskFields'
        - type: object
          required: [assessments, treatment_actions, acceptance]
          properties:
            assessments:
              type: array
              description: Every assessment, newest first.
              items:
                $ref: '#/components/schemas/RiskAssessment'
            treatment_actions:
              type: array
              description: Open tiltak by frist first, then completed ones, most recently completed first.
              items:
                $ref: '#/components/schemas/RiskTreatmentActionRow'
            acceptance:
              type: object
              description: The acceptance of residual risk.
              required: [current, history]
              additionalProperties: false
              properties:
                current:
                  description: The acceptance of the latest assessment that is not revoked, or null.
                  oneOf:
                    - $ref: '#/components/schemas/RiskAcceptance'
                    - type: 'null'
                history:
                  type: array
                  description: Earlier and revoked acceptances, newest first.
                  items:
                    $ref: '#/components/schemas/RiskAcceptance'
      unevaluatedProperties: false
    RiskAssessment:
      type: object
      required: [id, assessed_at, inherent, residual]
      additionalProperties: false
      properties:
        id:
          type: integer
        assessed_at:
          $ref: '#/components/schemas/Timestamp'
        inherent:
          $ref: '#/components/schemas/RiskScore'
        residual:
          description: Null when the assessment has no residual risk.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
    RiskTreatmentActionRowStatus:
      type: string
      enum: [open, completed]
    RiskTreatmentActionRow:
      type: object
      required: [id, title, status, owner, due_at, completed_at, is_overdue]
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskTreatmentActionRowStatus'
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_at:
          type: [string, 'null']
          format: date
          description: The frist.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        is_overdue:
          type: boolean
          description: Open, and the frist is before today.
    RiskAcceptanceState:
      type: string
      description: current, superseded (accepted for an assessment that is no longer the latest), or revoked.
      enum: [current, superseded, revoked]
    RiskAcceptance:
      type: object
      required: [id, assessment_id, state, accepted_at, valid_until, is_expired, revoked_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        assessment_id:
          type: integer
          description: The assessment whose residual risk was accepted.
        state:
          $ref: '#/components/schemas/RiskAcceptanceState'
        accepted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        valid_until:
          type: [string, 'null']
          format: date
        is_expired:
          type: boolean
          description: valid_until is before today.
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    RiskTreatmentActionCreate:
      type: object
      description: |
        The only fields accepted. Any other field (for example `status` or `outcome_note`) is
        ignored and never written.
      required: [title, owner_user_id, due_at]
      properties:
        title:
          type: string
          maxLength: 255
          description: Leading and trailing whitespace is removed.
        owner_user_id:
          type: integer
          description: |
            The responsible person: an active user of the same customer who can read this risk
            (`risk.view` in its fagområde). Not the integration identity. Anyone else is 422.
        due_at:
          type: string
          format: date
          description: The deadline, `YYYY-MM-DD`.
      example:
        title: Reservestrøm i serverrommet
        owner_user_id: 1234
        due_at: '2026-12-01'
    RiskTreatmentActionStatus:
      type: string
      description: A tiltak created through the API is always open.
      enum: [open]
    RiskTreatmentAction:
      type: object
      required: [id, risk_id, title, status, owner, due_at, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        risk_id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskTreatmentActionStatus'
        owner:
          description: The responsible person.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_at:
          type: string
          format: date
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ImprovementCaseStatus:
      type: string
      description: open and in_progress are active; closed and cancelled have ended.
      enum: [open, in_progress, closed, cancelled]
    ImprovementAttentionCode:
      type: string
      description: |
        Why an active case needs attention, in this order: its frist has passed, a tiltak's frist
        has passed, it has no responsible person, an active tiltak has no responsible person, a
        completed tiltak awaits effect verification, a tiltak was verified as not effective.
      enum: [case_overdue, action_overdue, case_owner_missing, action_owner_missing, awaiting_verification, not_effective]
    ImprovementCase:
      description: |
        An avvik or a forbedring, structured fields only. Not included: beskrivelse,
        årsaksanalyse, avslutningsnotat and other free text, the reporter, who closed it, tiltak
        titles and documents.
      allOf:
        - $ref: '#/components/schemas/ImprovementCaseFields'
      unevaluatedProperties: false
    ImprovementCaseFields:
      type: object
      description: The fields of a case in the register, shared by ImprovementCase and ImprovementCaseDetail.
      required: [id, title, status, business_area, owner, occurred_on, due_on, is_overdue, closed_at, follow_up, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
          description: Written by people. May contain personal data, in avvik most of all.
        status:
          $ref: '#/components/schemas/ImprovementCaseStatus'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The case's fagområde.
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        occurred_on:
          type: [string, 'null']
          format: date
          description: When it happened (hendelsesdato). Avvik only; always null for a forbedring.
        due_on:
          type: [string, 'null']
          format: date
          description: The frist.
        is_overdue:
          type: boolean
          description: Active, and the frist is before today.
        closed_at:
          description: When it was closed or cancelled.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        follow_up:
          type: object
          required: [actions_total, actions_open, attention]
          additionalProperties: false
          properties:
            actions_total:
              type: integer
              description: All tiltak on the case.
            actions_open:
              type: integer
              description: Tiltak still being worked on (planned or in progress).
            attention:
              type: array
              description: Empty unless the case is active.
              items:
                $ref: '#/components/schemas/ImprovementAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ImprovementCaseDetail:
      description: |
        A case with its tiltak. Not included: tiltak descriptions and completion notes,
        verification notes, who completed or verified, the status history, the Kvalitet links and
        the origin in other modules.
      allOf:
        - $ref: '#/components/schemas/ImprovementCaseFields'
        - type: object
          required: [actions]
          properties:
            actions:
              type: array
              description: The tiltak, in the order they were added.
              items:
                $ref: '#/components/schemas/ImprovementAction'
      unevaluatedProperties: false
    ImprovementActionStatus:
      type: string
      description: planned and in_progress are active; completed and cancelled have ended.
      enum: [planned, in_progress, completed, cancelled]
    ImprovementActionVerificationResult:
      type: string
      enum: [effective, not_effective]
    ImprovementAction:
      type: object
      required: [id, title, status, owner, due_on, is_overdue, completed_at, verification]
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
          description: Written by people. May contain personal data.
        status:
          $ref: '#/components/schemas/ImprovementActionStatus'
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_on:
          type: [string, 'null']
          format: date
          description: The frist.
        is_overdue:
          type: boolean
          description: The case is active, the tiltak is active, and its frist is before today.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        verification:
          type: object
          description: The effect verification (effektverifisering) of a completed tiltak.
          required: [awaiting, current, earlier]
          additionalProperties: false
          properties:
            awaiting:
              type: boolean
              description: Completed, and the current completion is not yet verified.
            current:
              description: The verification of the current completion, or null.
              oneOf:
                - $ref: '#/components/schemas/ImprovementActionVerification'
                - type: 'null'
            earlier:
              type: array
              description: Other verifications, newest first — of earlier completions that were later reopened.
              items:
                $ref: '#/components/schemas/ImprovementActionVerification'
    ImprovementActionVerification:
      type: object
      required: [id, result, verified_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        result:
          $ref: '#/components/schemas/ImprovementActionVerificationResult'
        verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ObjectiveStatus:
      type: string
      description: active, or closed as achieved, not_achieved or cancelled.
      enum: [active, achieved, not_achieved, cancelled]
    ObjectiveAttentionCode:
      type: string
      description: The objective's own reasons. A KPI's reasons are counted in `kpis.needing_attention`, never listed here.
      enum: [target_date_passed, owner_missing]
    Objective:
      description: |
        A mål, structured fields only. Not included: beskrivelse, avslutningsnotat, who closed it,
        the status history and the process context.
      allOf:
        - $ref: '#/components/schemas/ObjectiveFields'
      unevaluatedProperties: false
    ObjectiveDetail:
      description: A mål with its KPIs.
      allOf:
        - $ref: '#/components/schemas/ObjectiveFields'
        - type: object
          required: [kpi_list]
          properties:
            kpi_list:
              type: array
              description: Its KPIs, by id, as `GET /v1/kpis` presents them.
              items:
                $ref: '#/components/schemas/Kpi'
      unevaluatedProperties: false
    ObjectiveFields:
      type: object
      description: The fields of a mål in the register, shared by Objective and ObjectiveDetail.
      required: [id, title, status, business_area, owner, target_date, closed_at, kpis, attention, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/ObjectiveStatus'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The objective's fagområde.
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        target_date:
          type: [string, 'null']
          format: date
          description: Måldato.
        closed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        kpis:
          type: object
          required: [total, active, on_target, needing_attention]
          additionalProperties: false
          properties:
            total:
              type: integer
              description: All KPIs, retired ones included.
            active:
              type: integer
              description: Active KPIs.
            on_target:
              type: integer
              description: Active KPIs whose latest measurement is on target against today's målverdi.
            needing_attention:
              type: integer
              description: Active KPIs with at least one `KpiAttentionCode`.
        attention:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    KpiStatus:
      type: string
      enum: [active, retired]
    KpiUnit:
      type: string
      description: percent is a share (0–100); percent_change may be negative or above 100.
      enum: [percent, percent_change, count, number, currency, hours, days]
    KpiFrequency:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    KpiTargetType:
      type: string
      description: at_least (min only), at_most (max only), range (min and max), exact (min equals max).
      enum: [at_least, at_most, range, exact]
    KpiResult:
      type: string
      description: On target, within the tolerance (attention), or off target.
      enum: [on_target, attention, off_target]
    KpiCurrentResult:
      type: string
      description: The KPI's result now. `not_measured` when it has no measurement.
      enum: [on_target, attention, off_target, not_measured]
    KpiAttentionCode:
      type: string
      description: The latest measurement is not on target; a measurement is missing for a period that is due.
      enum: [kpi_off_target, measurement_missing]
    Decimal:
      type: string
      description: An exact decimal number as a string, without trailing zeros and without language formatting, for example `99.5` or `-3`.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['99.5']
    KpiMeasurement:
      type: object
      required: [period_start, period_end, value, recorded_at]
      additionalProperties: false
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/Decimal'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
    KpiMeasuredPeriod:
      type: object
      required: [period_start, period_end, value, recorded_at, result]
      additionalProperties: false
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/Decimal'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        result:
          $ref: '#/components/schemas/KpiResult'
          description: Against the målverdi that applied when the measurement was registered, not today's.
    Kpi:
      type: object
      description: |
        A KPI, structured fields only. Not included: beskrivelse, measurement comments, who
        registered or withdrew a measurement, withdrawal reasons, withdrawn and superseded
        measurements, and the process context.
      required: [id, objective_id, business_area, title, status, owner, unit, unit_label, currency_code, target, baseline, frequency, reporting_grace_days, latest_measurement, result, measurements, attention, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        objective_id:
          type: integer
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The objective's fagområde.
        title:
          type: string
        status:
          $ref: '#/components/schemas/KpiStatus'
        owner:
          description: The KPI's own responsible person, or else the objective's (`inherited` true). Null when neither has one.
          oneOf:
            - type: object
              required: [id, name, inherited]
              additionalProperties: false
              properties:
                id:
                  type: integer
                name:
                  type: string
                inherited:
                  type: boolean
            - type: 'null'
        unit:
          $ref: '#/components/schemas/KpiUnit'
        unit_label:
          type: [string, 'null']
          description: A free label for count and number (for example «saker»). Null otherwise.
        currency_code:
          type: [string, 'null']
          description: Set for currency only, for example `NOK`.
        target:
          type: object
          description: The målverdi now. At least one of min and max is set.
          required: [type, min, max, tolerance]
          additionalProperties: false
          properties:
            type:
              $ref: '#/components/schemas/KpiTargetType'
            min:
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
            max:
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
            tolerance:
              description: The margin outside the target that counts as attention rather than off target.
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
        baseline:
          description: Startverdi, when the målverdi was set as change from a starting level.
          oneOf:
            - type: object
              required: [value, date]
              additionalProperties: false
              properties:
                value:
                  $ref: '#/components/schemas/Decimal'
                date:
                  type: [string, 'null']
                  format: date
            - type: 'null'
        frequency:
          description: The measuring frequency, or null for no fixed frequency.
          oneOf:
            - $ref: '#/components/schemas/KpiFrequency'
            - type: 'null'
        reporting_grace_days:
          type: integer
          minimum: 0
          description: Days after a period ends before its missing measurement counts as missing.
        latest_measurement:
          description: The latest current measurement, or null.
          oneOf:
            - $ref: '#/components/schemas/KpiMeasurement'
            - type: 'null'
        result:
          $ref: '#/components/schemas/KpiCurrentResult'
          description: The latest measurement against today's målverdi.
        measurements:
          type: array
          maxItems: 24
          description: The latest 24 measured periods, oldest first, one current measurement per period. The whole history is `GET /v1/kpis/{kpiId}/measurements`.
          items:
            $ref: '#/components/schemas/KpiMeasuredPeriod'
        attention:
          type: array
          description: Only active KPIs under active objectives have codes.
          items:
            $ref: '#/components/schemas/KpiAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ManagementReviewStatus:
      type: string
      description: draft until finalized; a finalized review is fixed.
      enum: [draft, finalized]
    ManagementReviewJudgement:
      type: string
      enum: [satisfactory, needs_improvement, not_satisfactory]
    ManagementReviewSectionType:
      type: string
      description: own (the review's previous decisions), manual (judged without module figures), module (built from a module).
      enum: [own, manual, module]
    ManagementReviewSectionState:
      type: string
      description: |
        available; module_unavailable (the customer does not have the module); no_access (the
        identity may not read the module); not_captured (a finalized review's section that was not
        captured at finalization).
      enum: [available, module_unavailable, no_access, not_captured]
    ManagementReviewDecisionKind:
      type: string
      description: decision (a recorded decision) or action (a tiltak with ansvarlig and frist).
      enum: [decision, action]
    ManagementReviewDecisionFollowUp:
      type: string
      description: own (followed up in the review) or improvement_case (followed up as a case in Avvik og forbedringer).
      enum: [own, improvement_case]
    ManagementReviewDecisionStatus:
      type: string
      enum: [open, completed, cancelled]
    ManagementReview:
      description: |
        A ledelsens gjennomgang, structured fields only. Not included: purpose, conclusion, who
        finalized it.
      allOf:
        - $ref: '#/components/schemas/ManagementReviewFields'
      unevaluatedProperties: false
    ManagementReviewFields:
      type: object
      required: [id, title, status, period_start, period_end, meeting_date, scope, frameworks, owner, next_review_due_on, finalized_at, decisions, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/ManagementReviewStatus'
        period_start:
          type: [string, 'null']
          format: date
        period_end:
          type: [string, 'null']
          format: date
        meeting_date:
          type: [string, 'null']
          format: date
        scope:
          type: object
          description: What the review's basis covers. It never limits who may read the review.
          required: [all_business_areas, business_areas]
          additionalProperties: false
          properties:
            all_business_areas:
              type: boolean
              description: The whole organisation («Hele virksomheten»).
            business_areas:
              type: array
              description: The chosen fagområder. Empty when all_business_areas is true.
              items:
                $ref: '#/components/schemas/Reference'
        frameworks:
          type: array
          description: The standards the review is held against, by library key (for example `iso9001:2015`).
          items:
            type: string
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        next_review_due_on:
          type: [string, 'null']
          format: date
        finalized_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        decisions:
          type: object
          required: [total, actions_open]
          additionalProperties: false
          properties:
            total:
              type: integer
              description: Decisions and tiltak.
            actions_open:
              type: integer
              description: Tiltak followed up in the review that are still open.
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ManagementReviewDetail:
      description: A review with its sections and decisions, under the review page's gates.
      allOf:
        - $ref: '#/components/schemas/ManagementReviewFields'
        - type: object
          required: [participant_count, sections, decision_list]
          properties:
            participant_count:
              type: integer
              description: How many took part. Their names are not included.
            sections:
              type: array
              items:
                $ref: '#/components/schemas/ManagementReviewSection'
            decision_list:
              type: array
              description: Decisions and tiltak, in the review's order.
              items:
                $ref: '#/components/schemas/ManagementReviewDecision'
      unevaluatedProperties: false
    ManagementReviewSection:
      type: object
      required: [key, type, module, state, judgement]
      additionalProperties: false
      properties:
        key:
          type: string
          description: The section, for example `risks`, `compliance` or `resources`.
        type:
          $ref: '#/components/schemas/ManagementReviewSectionType'
        module:
          type: [string, 'null']
          description: The module a section's figures come from (`risk`, `objectives`, `improvements`, `compliance`, `quality`, `supplier`), or null.
        state:
          $ref: '#/components/schemas/ManagementReviewSectionState'
        judgement:
          description: The review's judgement of the section. Null when not judged, or when the identity may not see the section's basis.
          oneOf:
            - $ref: '#/components/schemas/ManagementReviewJudgement'
            - type: 'null'
    ManagementReviewDecision:
      type: object
      required: [id, kind, section_key, owner, due_on, follow_up, status, is_overdue, completed_at, improvement_case]
      additionalProperties: false
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/ManagementReviewDecisionKind'
        section_key:
          type: [string, 'null']
          description: The section it belongs to, or null.
        owner:
          description: The tiltak's responsible person. Null for a decision.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_on:
          type: [string, 'null']
          format: date
        follow_up:
          description: Null for a decision.
          oneOf:
            - $ref: '#/components/schemas/ManagementReviewDecisionFollowUp'
            - type: 'null'
        status:
          description: Of a tiltak followed up in the review. Null for a decision and for one followed up as a case.
          oneOf:
            - $ref: '#/components/schemas/ManagementReviewDecisionStatus'
            - type: 'null'
        is_overdue:
          type: boolean
          description: Open, followed up in the review, and the frist is before today.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        improvement_case:
          description: |
            The case in Avvik og forbedringer the tiltak is followed up in, with its live status and
            frist, when the identity may read it there. Null otherwise.
          oneOf:
            - type: object
              required: [id, status, due_on]
              additionalProperties: false
              properties:
                id:
                  type: integer
                status:
                  $ref: '#/components/schemas/ImprovementCaseStatus'
                due_on:
                  type: [string, 'null']
                  format: date
            - type: 'null'

    ComplianceRequirementStatus:
      type: string
      enum: [active, retired]
    ComplianceApplicability:
      type: string
      description: A library requirement's relevance — for an Annex A control its Kontrollvalg (applies = Inkludert, not_applicable = Utelatt).
      enum: [applies, not_applicable, not_assessed]
    ComplianceResult:
      type: string
      description: The latest assessment's result, not_applicable for a library requirement found not relevant, or not_assessed.
      enum: [compliant, partially_compliant, non_compliant, not_applicable, not_assessed]
    ComplianceAssessmentResult:
      type: string
      enum: [compliant, partially_compliant, non_compliant, not_applicable]
    ComplianceOverviewGroup:
      type: string
      description: Etterlevelsesvurdering's group. relevance_open is a library requirement whose relevance is not yet decided.
      enum: [compliant, partially_compliant, non_compliant, not_assessed, not_applicable, relevance_open]
    ComplianceRequirementAttentionCode:
      type: string
      description: Why an active, relevant requirement needs attention, in this order.
      enum: [not_assessed, non_compliant, partially_compliant, review_overdue]
    ComplianceSourceKind:
      type: string
      enum: [standard, law, contract, internal, other]
    ComplianceSource:
      type: object
      required: [id, label, kind, from_library]
      additionalProperties: false
      properties:
        id:
          type: integer
        label:
          type: string
          description: For example «ISO 27001:2022» for an activated standard, otherwise «Name (version)».
        kind:
          $ref: '#/components/schemas/ComplianceSourceKind'
        from_library:
          type: boolean
          description: Activated from Kravbiblioteket.
    ComplianceRequirement:
      description: A requirement in the register, without the requirement text and the relevance rationale.
      allOf:
        - $ref: '#/components/schemas/ComplianceRequirementFields'
      unevaluatedProperties: false
    ComplianceRequirementFields:
      type: object
      required: [id, reference, title, status, source, from_library, is_control, applicability, owner, review_interval_months, compliance, attention, created_at, updated_at]
      properties:
        id:
          type: integer
        reference:
          type: [string, 'null']
          description: The clause or reference, for example `A.5.15`.
        title:
          type: string
        status:
          $ref: '#/components/schemas/ComplianceRequirementStatus'
        source:
          oneOf:
            - $ref: '#/components/schemas/ComplianceSource'
            - type: 'null'
        from_library:
          type: boolean
        is_control:
          type: boolean
          description: An Annex A control.
        applicability:
          description: Relevans for a library requirement; null for one registered by hand.
          oneOf:
            - $ref: '#/components/schemas/ComplianceApplicability'
            - type: 'null'
        owner:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        review_interval_months:
          description: How often it is to be assessed again, or null.
          oneOf:
            - type: integer
              enum: [1, 3, 6, 12]
            - type: 'null'
        compliance:
          type: object
          required: [status, group, last_assessed_at, next_review_on, is_overdue, changed_since_assessment]
          additionalProperties: false
          properties:
            status:
              $ref: '#/components/schemas/ComplianceResult'
            group:
              $ref: '#/components/schemas/ComplianceOverviewGroup'
            last_assessed_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            next_review_on:
              type: [string, 'null']
              format: date
            is_overdue:
              type: boolean
              description: Today is after next_review_on.
            changed_since_assessment:
              type: boolean
              description: The requirement or its source has changed since the latest assessment.
        attention:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRequirementAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ComplianceRequirementDetail:
      allOf:
        - $ref: '#/components/schemas/ComplianceRequirementFields'
        - type: object
          required: [assessments]
          properties:
            assessments:
              type: array
              description: Every assessment, newest first. Not who assessed, nor the rationale.
              items:
                type: object
                required: [id, result, assessed_at]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  result:
                    $ref: '#/components/schemas/ComplianceAssessmentResult'
                  assessed_at:
                    oneOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - type: 'null'
      unevaluatedProperties: false
    ComplianceStats:
      type: object
      description: |
        Etterlevelsesvurdering's counts. assessable is compliant + partially_compliant +
        non_compliant + not_assessed; assessed excludes not_assessed; overdue counts assessable
        requirements past their review date.
      required: [assessable, assessed, compliant, partially_compliant, non_compliant, not_assessed, overdue, not_applicable, relevance_open]
      additionalProperties: false
      properties:
        assessable:
          type: integer
        assessed:
          type: integer
        compliant:
          type: integer
        partially_compliant:
          type: integer
        non_compliant:
          type: integer
        not_assessed:
          type: integer
        overdue:
          type: integer
        not_applicable:
          type: integer
        relevance_open:
          type: integer
    ComplianceStatus:
      type: object
      required: [total, per_source]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/ComplianceStats'
        per_source:
          type: array
          description: One row per source with active requirements, by name.
          items:
            type: object
            required: [source, stats]
            additionalProperties: false
            properties:
              source:
                $ref: '#/components/schemas/ComplianceSource'
              stats:
                $ref: '#/components/schemas/ComplianceStats'
    ComplianceAuditStatus:
      type: string
      enum: [planned, in_progress, completed, cancelled]
    ComplianceAuditType:
      type: string
      enum: [internal, external]
    ComplianceAuditAttentionCode:
      type: string
      description: overdue (planned or in progress past its planned end date); nonconformity_without_follow_up (completed, with a nonconformity not handed off).
      enum: [overdue, nonconformity_without_follow_up]
    ComplianceFindingType:
      type: string
      enum: [nonconformity, observation, opportunity]
    ComplianceRelevance:
      type: string
      enum: [applies, not_applicable, relevance_open]
    ComplianceAudit:
      description: An audit, without its purpose, scope description, conclusion and the auditor's name.
      allOf:
        - $ref: '#/components/schemas/ComplianceAuditFields'
      unevaluatedProperties: false
    ComplianceAuditFields:
      type: object
      required: [id, title, audit_type, status, responsible, planned_start_date, planned_end_date, counts, attention, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        audit_type:
          $ref: '#/components/schemas/ComplianceAuditType'
        status:
          $ref: '#/components/schemas/ComplianceAuditStatus'
        responsible:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        planned_start_date:
          type: [string, 'null']
          format: date
        planned_end_date:
          type: [string, 'null']
          format: date
        counts:
          type: object
          required: [requirements, checks, findings]
          additionalProperties: false
          properties:
            requirements:
              type: integer
              description: Requirements in scope.
            checks:
              type: integer
              description: Kontrollhandlinger.
            findings:
              type: integer
        attention:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceAuditAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ComplianceAuditDetail:
      allOf:
        - $ref: '#/components/schemas/ComplianceAuditFields'
        - type: object
          required: [requirements, checks, findings]
          properties:
            requirements:
              type: array
              description: The requirements in scope, in the register's order.
              items:
                type: object
                required: [id, reference, title, status, relevance, is_control, source_id, check_count, finding_count]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  reference:
                    type: [string, 'null']
                  title:
                    type: string
                  status:
                    $ref: '#/components/schemas/ComplianceRequirementStatus'
                  relevance:
                    $ref: '#/components/schemas/ComplianceRelevance'
                  is_control:
                    type: boolean
                  source_id:
                    type: integer
                  check_count:
                    type: integer
                  finding_count:
                    type: integer
            checks:
              type: array
              description: The kontrollhandlinger, in the order recorded. Their observations and evidence are not included.
              items:
                type: object
                required: [id, title, requirement_ids, finding_ids]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  requirement_ids:
                    type: array
                    items:
                      type: integer
                  finding_ids:
                    type: array
                    items:
                      type: integer
            findings:
              type: array
              description: The findings, in the order recorded. Their descriptions are not included.
              items:
                type: object
                required: [id, finding_type, title, requirement_id, check_id, improvement_type, handed_off, handed_off_at, improvement_case_id]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  finding_type:
                    $ref: '#/components/schemas/ComplianceFindingType'
                  title:
                    type: string
                    description: Written by people. May contain personal data.
                  requirement_id:
                    type: [integer, 'null']
                  check_id:
                    type: [integer, 'null']
                  improvement_type:
                    description: What a hand-off to Avvik og forbedringer becomes, or null.
                    oneOf:
                      - type: string
                        enum: [deviation, improvement]
                      - type: 'null'
                  handed_off:
                    type: boolean
                  handed_off_at:
                    oneOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - type: 'null'
                  improvement_case_id:
                    type: [integer, 'null']
                    description: The case, when the identity may read it in Avvik og forbedringer. Null otherwise, even when handed off.
      unevaluatedProperties: false
    ComplianceFramework:
      type: object
      required: [id, key, reference, edition, label, name, content_verified, source_id, requirement_count, has_controls]
      additionalProperties: false
      properties:
        id:
          type: integer
        key:
          type: string
          description: For example `iso9001:2015`.
        reference:
          type: string
        edition:
          type: [string, 'null']
        label:
          type: string
        name:
          type: string
        content_verified:
          type: boolean
          description: Whether the library's content has been checked against the standard.
        source_id:
          type: [integer, 'null']
          description: The customer's source for the standard when activated, otherwise null.
        requirement_count:
          type: integer
        has_controls:
          type: boolean
    ComplianceFrameworkDetail:
      type: object
      required: [id, key, reference, edition, label, name, content_verified, source_id, requirement_count, has_controls, nodes]
      additionalProperties: false
      properties:
        id:
          type: integer
        key:
          type: string
        reference:
          type: string
        edition:
          type: [string, 'null']
        label:
          type: string
        name:
          type: string
        content_verified:
          type: boolean
        source_id:
          type: [integer, 'null']
        requirement_count:
          type: integer
        has_controls:
          type: boolean
        nodes:
          type: array
          description: The chapters and requirements, flat in the standard's order; nest them by parent_id.
          items:
            $ref: '#/components/schemas/ComplianceFrameworkNode'
    ComplianceFrameworkNodeKind:
      type: string
      enum: [section, requirement]
    ComplianceFrameworkNode:
      type: object
      required: [id, parent_id, clause, kind, depth, title, requirement_type, applicability_rule, withdrawn, requirement_id]
      additionalProperties: false
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, 'null']
        clause:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/ComplianceFrameworkNodeKind'
        depth:
          type: integer
        title:
          type: string
        requirement_type:
          description: A requirement's type; null for a section.
          oneOf:
            - type: string
              enum: [activity, leadership, documented_information, control]
            - type: 'null'
        applicability_rule:
          description: mandatory, conditional (may be not relevant) or control (Annex A); null for a section.
          oneOf:
            - type: string
              enum: [mandatory, conditional, control]
            - type: 'null'
        withdrawn:
          type: boolean
        requirement_id:
          type: [integer, 'null']
          description: The customer's requirement for this node, when it has activated the standard.
