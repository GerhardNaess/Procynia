  /v1/management-reviews/{reviewId}:
    get:
      tags: [Management review]
      operationId: getManagementReview
      summary: One review with its sections and decisions
      description: |
        One review the integration identity may read, with each section's state and judgement and
        every decision and tiltak. The review page's own gates apply: a module section's judgement
        is given only when the identity may read that module (otherwise its state is `no_access`
        and the judgement null), and a case followed up in Avvik og forbedringer is named only when
        the identity may read cases in that case's fagområde. A review of another customer, or one
        that does not exist, is 404.

        Not included: purpose, conclusion, section comments and notes, decision texts, completion
        notes, amendments, participants' names, who finalized, the history and the basis figures
        from the other modules (read those through the modules' own endpoints).

        Requires the Ledelsens gjennomgang module and `management_review.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
