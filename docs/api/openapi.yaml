openapi: 3.1.0

# The contract of the external Procynia API, as implemented. Maintained by hand next to the code:
# see docs/api/README.md. tests/Feature/Api/ApiOpenApiContractTest.php keeps the paths, methods,
# enums and error codes in agreement with the route table and the code.

info:
  title: Procynia API
  version: 1.0.0
  summary: Read access to Procynia's governance registers, and named write operations, for integrations.
  description: |
    The external API of Procynia for integrations acting for a customer (for example a dashboard
    supplier). It is **not in production** yet: it has been verified locally with automated tests,
    not with a real Microsoft Entra ID token.

    ## Who is calling

    **Authentication.** Every request carries an access token from Microsoft Entra ID (v2.0) in
    application mode (client credentials), issued for the Procynia API. The token must:

    - be signed with RS256 by the client's home tenant, with issuer
      `https://login.microsoftonline.com/{tenant}/v2.0` and `ver` `2.0`;
    - name the Procynia API as audience;
    - come from a client application Procynia has registered and enabled (the pair `azp` and `tid`);
    - be an application token: a delegated token (with `scp`) is refused with 403;
    - carry the app role `Procynia.Read.All`. Write operations also need `Procynia.Write.All`.

    The app roles are a ceiling only. They decide that the client may call the API, never what it
    may read or do.

    **Customer.** The token cannot say which customer the call is for. The `Procynia-Customer` header
    names it, and only selects among the active customer grants the client holds. A grant is given
    and revoked by the customer's System Owner in Kundemiljø → Integrasjoner. Without an active
    grant the answer is 403, the same as for a customer that does not exist.

    **Access.** From the grant on, the request runs as the grant's integration identity: a non-human
    user of that customer. Everything it reads goes through the same access rules as for a person:
    the customer's modules, the permissions of the identity's roles, and its fagområder (business
    areas). A list is always that visible set. Filters and cursors narrow it and never widen it, so
    an id from another customer or another fagområde finds nothing.

    **Writes.** A write operation needs all of: the `Procynia.Write.All` app role, the operation
    switched on for the grant by the customer's System Owner, and the domain's own access check for
    the record. Formal human decisions (assessments, approvals, acceptance of risk, closing,
    deleting) are never available to an integration.

    ## Conventions

    - Every success response is `{"data": …, "meta": {"as_of", "request_id", …}}`.
    - Every error response is `{"error": {"code", "message", "request_id"}}` (see `Error`).
    - Every response, success or error, carries `X-Request-Id`, the same id as `request_id`. It is
      always generated by Procynia, never taken from the client.
    - Times are UTC in ISO 8601 with a `Z` suffix, to the second. Dates are `YYYY-MM-DD`.
    - Lists are cursor-paginated by ascending `id` (see `limit` and `cursor`).
    - Responses are JSON whatever the `Accept` header says. `GET` routes also answer `HEAD`.
    - Fields not listed here are never sent. Free text (descriptions, causes, notes, justifications),
      documents, files and web links are deliberately not part of the API.
    - Unknown query parameters and unknown body fields are ignored.

    ## Limits

    - Rate limit: 240 requests per minute per (client application, customer) by default. Over the limit the
      answer is 429 with `Retry-After`.
    - No write is idempotent: repeating a write request creates another record.
    - Nothing in the API starts AI work.
  contact:
    name: Procynia

servers:
  - url: /api
    description: The API is served under /api on the Procynia host.

security:
  - entraApplicationToken: [Procynia.Read.All]

tags:
  - name: Common
    description: Who is calling and what it can read.
  - name: Risk
    description: Risiko — the risk register and treatment actions (tiltak).
  - name: Deviations and improvements
    description: Avvik og forbedringer — deviations (avvik) and improvement proposals (forbedringer), each on its own endpoints.
  - name: Objectives and KPIs
    description: Mål og KPI.
  - name: Management review
    description: Ledelsens gjennomgang.
  - name: Compliance and audit
    description: Etterlevelse og revisjon — kravregister, status, revisjoner and Kravbiblioteket.

paths:
  /v1/me:
    get:
      tags: [Common]
      operationId: getMe
      summary: Who the caller is acting as, and what it can read
      description: |
        The client application, the customer selected by `Procynia-Customer`, the integration
        identity the request runs as, and per module whether it is ordered by the customer and
        readable by the identity, with the fagområder it reaches. The same summary the customer's
        System Owner sees in Kundemiljø → Integrasjoner.

        This route needs no module.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
      responses:
        '200':
          description: The caller.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/attention:
    get:
      tags: [Common]
      operationId: getAttention
      summary: What needs following up, across modules
      description: |
        Every record the integration identity may read that needs attention now, across Risiko,
        Avvik og forbedringer, Mål og KPI and Etterlevelse og revisjon, with the reasons as codes.
        Each module's own rules decide, over the same set as its register's «Trenger
        oppmerksomhet»: risks that are not closed, active avvik and forbedringer, active
        objectives and their active KPIs, active requirements and audits that are not cancelled.
        The codes are the same as on the records' own rows.

        A module the customer has not ordered, or the identity may not read, is `false` under
        `modules` and contributes no items. This route needs no module and is returned whole,
        without pagination: risks, then avvik, forbedringer, objectives, KPIs, requirements and
        audits, each by id.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
      responses:
        '200':
          description: What needs attention.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/AttentionOverview'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/business-areas:
    get:
      tags: [Common]
      operationId: listBusinessAreas
      summary: The fagområder the caller reads in
      description: |
        The customer's fagområder (business areas) the integration identity reads in, with the
        modules it reads them in: the reference data for `business_area` on every record and for
        the `business_area_id` filters. Where `/v1/me` says `"all"`, the areas are listed here.
        An area the identity reaches in no readable module is not listed. Ordered by name.

        This route needs no module and is returned whole, without pagination.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
      responses:
        '200':
          description: The fagområder.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessArea'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks:
    get:
      tags: [Risk]
      operationId: listRisks
      summary: The risk register
      description: |
        The risks the integration identity may read: the customer's risks in the fagområder where
        its roles give `risk.view`. Each risk carries the scoring of its latest assessment and its
        periodic review, computed by the same rules as the register in the web application.

        Requires the Risiko module and `risk.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: status
          in: query
          required: false
          description: Only risks with this status.
          schema:
            $ref: '#/components/schemas/RiskStatus'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of risks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Risk'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks/{riskId}:
    get:
      tags: [Risk]
      operationId: getRisk
      summary: One risk with its history and follow-up
      description: |
        One risk the integration identity may read, with the fields of the register, the
        assessment history, the treatment actions (tiltak) and the acceptance of residual risk.
        A risk of another customer, outside the identity's fagområder, or one that does not exist
        is 404.

        Not included: the links to Kvalitet (controls, process context), which become available
        when Kvalitet can be read through the API, and the supplier the risk concerns.

        Requires the Risiko module and `risk.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/RiskId'
      responses:
        '200':
          description: The risk.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RiskDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks/{riskId}/treatment-actions:
    post:
      tags: [Risk]
      operationId: createRiskTreatmentAction
      summary: Create a treatment action (tiltak) on a risk
      description: |
        Write operation `risk.treatment_action.create`. Creates an open tiltak on the risk through
        the same domain service, rules and responsible-person check as the risk page. The
        responsible person is notified as from the web application, and the risk page shows which
        integration registered the tiltak. Nothing else on the risk changes.

        Requires, in this order of checking (after the token and the customer grant):

        1. The customer has ordered the Risiko module (403).
        2. The app role `Procynia.Write.All` in the token (403).
        3. The integration identity has `risk.view` (403).
        4. The risk is visible to the identity: same customer and one of its fagområder. Any other
           risk, or one that does not exist, is 404.
        5. The customer's System Owner has switched on `risk.treatment_action.create` for the grant
           (403).
        6. A valid body (422).

        Not idempotent: the same request twice creates two tiltak. The tiltak cannot be changed,
        completed or reopened through the API.
      security:
        - entraApplicationToken: [Procynia.Read.All, Procynia.Write.All]
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/RiskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskTreatmentActionCreate'
      responses:
        '201':
          description: The tiltak was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RiskTreatmentAction'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deviations:
    get:
      tags: [Deviations and improvements]
      operationId: listDeviations
      summary: The deviation register (avvik)
      description: |
        The avvik the integration identity may read: the customer's cases of type avvik in the
        fagområder where its roles give `improvement.view`. Improvement proposals (forbedringer)
        are not part of this endpoint: see `GET /v1/improvements`. The follow-up is computed by
        the same rules as «Trenger oppmerksomhet» in the web application.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ImprovementCaseStatusFilter'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/ImprovementCaseOverdue'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of avvik.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImprovementCase'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deviations/{caseId}:
    get:
      tags: [Deviations and improvements]
      operationId: getDeviation
      summary: One avvik with its tiltak
      description: |
        One avvik the integration identity may read, with the fields of the register and its
        tiltak, each with its effect verification (effektverifisering). An avvik of another
        customer, outside the identity's fagområder, a forbedring, or one that does not exist is
        404.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ImprovementCaseDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/improvements:
    get:
      tags: [Deviations and improvements]
      operationId: listImprovements
      summary: The improvement proposals (forbedringer)
      description: |
        The forbedringer the integration identity may read: the customer's cases of type
        forbedring in the fagområder where its roles give `improvement.view`. The same fields,
        filters and access rule as `GET /v1/deviations`. Avvik are not part of this endpoint.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ImprovementCaseStatusFilter'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/ImprovementCaseOverdue'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of forbedringer.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImprovementCase'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/improvements/{caseId}:
    get:
      tags: [Deviations and improvements]
      operationId: getImprovement
      summary: One forbedring with its tiltak
      description: |
        One forbedring the integration identity may read, in the same fields as
        `GET /v1/deviations/{caseId}`. A forbedring of another customer, outside the identity's
        fagområder, an avvik, or one that does not exist is 404.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ImprovementCaseDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/objectives:
    get:
      tags: [Objectives and KPIs]
      operationId: listObjectives
      summary: The objective register (mål)
      description: |
        The mål the integration identity may read: the customer's objectives in the fagområder
        where its roles give `objective.view`, with their KPIs counted. The counts and attention
        codes follow the same rules as the register in the web application.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: status
          in: query
          required: false
          description: Only objectives with this status.
          schema:
            $ref: '#/components/schemas/ObjectiveStatus'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of objectives.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Objective'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/objectives/{objectiveId}:
    get:
      tags: [Objectives and KPIs]
      operationId: getObjective
      summary: One objective (mål) with its KPIs
      description: |
        One objective the integration identity may read, with the fields of the register and its
        KPIs as `GET /v1/kpis` presents them. An objective of another customer, outside the
        identity's fagområder, or one that does not exist is 404.

        Not included: the process context in Kvalitet, which becomes available when Kvalitet can be
        read through the API.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ObjectiveId'
      responses:
        '200':
          description: The objective.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ObjectiveDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/kpis:
    get:
      tags: [Objectives and KPIs]
      operationId: listKpis
      summary: KPIs with their latest measured periods
      description: |
        The KPIs of the objectives the integration identity may read, and nothing else. A KPI has
        no fagområde of its own: it has its objective's. Each KPI carries its latest 24 measured
        periods. Withdrawn and superseded measurements are never included.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: objective_id
          in: query
          required: false
          description: Only the KPIs of this objective.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: Only KPIs with this status.
          schema:
            $ref: '#/components/schemas/KpiStatus'
        - name: business_area_id
          in: query
          required: false
          description: Only KPIs whose objective is in this fagområde. An id the caller cannot see gives an empty list.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of KPIs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kpi'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/kpis/{kpiId}/measurements:
    get:
      tags: [Objectives and KPIs]
      operationId: listKpiMeasurements
      summary: The whole measurement history (målehistorikk) of one KPI
      description: |
        Every measured period of one KPI the integration identity may read, oldest first, with the
        current measurement of each period — beyond the latest 24 that `GET /v1/kpis` carries.
        Superseded (corrected) and withdrawn measurements are never included. Each period is judged
        against the målverdi that applied when it was registered.

        The history of one KPI is returned whole, without pagination. A KPI under an objective of
        another customer or outside the identity's fagområder, or one that does not exist, is 404.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/KpiId'
      responses:
        '200':
          description: The measured periods, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiMeasuredPeriod'
                  meta:
                    $ref: '#/components/schemas/Meta'
