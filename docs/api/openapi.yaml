openapi: 3.1.0

# The contract of the external Procynia API, as implemented. Maintained by hand next to the code:
# see docs/api/README.md. tests/Feature/Api/ApiOpenApiContractTest.php keeps the paths, methods,
# enums and error codes in agreement with the route table and the code.

info:
  title: Procynia API
  version: 1.0.0
  summary: Read access to Procynia's governance registers, and named write operations, for integrations.
  description: |
    The external API of Procynia for integrations acting for a customer (for example a dashboard
    supplier). It is **not in production** yet: it has been verified locally with automated tests,
    not with a real Microsoft Entra ID token.

    ## Who is calling

    **Authentication.** Every request carries an access token from Microsoft Entra ID (v2.0) in
    application mode (client credentials), issued for the Procynia API. The token must:

    - be signed with RS256 by the client's home tenant, with issuer
      `https://login.microsoftonline.com/{tenant}/v2.0` and `ver` `2.0`;
    - name the Procynia API as audience;
    - come from a client application Procynia has registered and enabled (the pair `azp` and `tid`);
    - be an application token: a delegated token (with `scp`) is refused with 403;
    - carry the app role `Procynia.Read.All`. Write operations also need `Procynia.Write.All`.

    The app roles are a ceiling only. They decide that the client may call the API, never what it
    may read or do.

    **Customer.** The token cannot say which customer the call is for. The `Procynia-Customer` header
    names it, and only selects among the active customer grants the client holds. A grant is given
    and revoked by the customer's System Owner in Kundemiljø → Integrasjoner. Without an active
    grant the answer is 403, the same as for a customer that does not exist.

    **Access.** From the grant on, the request runs as the grant's integration identity: a non-human
    user of that customer. Everything it reads goes through the same access rules as for a person:
    the customer's modules, the permissions of the identity's roles, and its fagområder (business
    areas). A list is always that visible set. Filters and cursors narrow it and never widen it, so
    an id from another customer or another fagområde finds nothing.

    **Writes.** A write operation needs all of: the `Procynia.Write.All` app role, the operation
    switched on for the grant by the customer's System Owner, and the domain's own access check for
    the record. Formal human decisions (assessments, approvals, acceptance of risk, closing,
    deleting) are never available to an integration.

    ## Conventions

    - Every success response is `{"data": …, "meta": {"as_of", "request_id", …}}`.
    - Every error response is `{"error": {"code", "message", "request_id"}}` (see `Error`).
    - Every response, success or error, carries `X-Request-Id`, the same id as `request_id`. It is
      always generated by Procynia, never taken from the client.
    - Times are UTC in ISO 8601 with a `Z` suffix, to the second. Dates are `YYYY-MM-DD`.
    - Lists are cursor-paginated by ascending `id` (see `limit` and `cursor`).
    - Responses are JSON whatever the `Accept` header says. `GET` routes also answer `HEAD`.
    - Fields not listed here are never sent. Free text (descriptions, causes, notes, justifications),
      documents, files and web links are deliberately not part of the API.
    - Unknown query parameters and unknown body fields are ignored.

    ## Limits

    - Rate limit: 240 requests per minute per (client application, customer) by default. Over the limit the
      answer is 429 with `Retry-After`.
    - No write is idempotent: repeating a write request creates another record.
    - Nothing in the API starts AI work.
  contact:
    name: Procynia

servers:
  - url: /api
    description: The API is served under /api on the Procynia host.

security:
  - entraApplicationToken: [Procynia.Read.All]

tags:
  - name: Common
    description: Who is calling and what it can read.
  - name: Risk
    description: Risiko — the risk register and treatment actions (tiltak).
  - name: Deviations and improvements
    description: Avvik og forbedringer — deviations (avvik) and improvement proposals (forbedringer), each on its own endpoints.
  - name: Objectives and KPIs
    description: Mål og KPI.

paths:
  /v1/me:
    get:
      tags: [Common]
      operationId: getMe
      summary: Who the caller is acting as, and what it can read
      description: |
        The client application, the customer selected by `Procynia-Customer`, the integration
        identity the request runs as, and per module whether it is ordered by the customer and
        readable by the identity, with the fagområder it reaches. The same summary the customer's
        System Owner sees in Kundemiljø → Integrasjoner.

        This route needs no module.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
      responses:
        '200':
          description: The caller.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks:
    get:
      tags: [Risk]
      operationId: listRisks
      summary: The risk register
      description: |
        The risks the integration identity may read: the customer's risks in the fagområder where
        its roles give `risk.view`. Each risk carries the scoring of its latest assessment and its
        periodic review, computed by the same rules as the register in the web application.

        Requires the Risiko module and `risk.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: status
          in: query
          required: false
          description: Only risks with this status.
          schema:
            $ref: '#/components/schemas/RiskStatus'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of risks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Risk'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks/{riskId}:
    get:
      tags: [Risk]
      operationId: getRisk
      summary: One risk with its history and follow-up
      description: |
        One risk the integration identity may read, with the fields of the register, the
        assessment history, the treatment actions (tiltak) and the acceptance of residual risk.
        A risk of another customer, outside the identity's fagområder, or one that does not exist
        is 404.

        Not included: the links to Kvalitet (controls, process context), which become available
        when Kvalitet can be read through the API, and the supplier the risk concerns.

        Requires the Risiko module and `risk.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/RiskId'
      responses:
        '200':
          description: The risk.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RiskDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/risks/{riskId}/treatment-actions:
    post:
      tags: [Risk]
      operationId: createRiskTreatmentAction
      summary: Create a treatment action (tiltak) on a risk
      description: |
        Write operation `risk.treatment_action.create`. Creates an open tiltak on the risk through
        the same domain service, rules and responsible-person check as the risk page. The
        responsible person is notified as from the web application, and the risk page shows which
        integration registered the tiltak. Nothing else on the risk changes.

        Requires, in this order of checking (after the token and the customer grant):

        1. The customer has ordered the Risiko module (403).
        2. The app role `Procynia.Write.All` in the token (403).
        3. The integration identity has `risk.view` (403).
        4. The risk is visible to the identity: same customer and one of its fagområder. Any other
           risk, or one that does not exist, is 404.
        5. The customer's System Owner has switched on `risk.treatment_action.create` for the grant
           (403).
        6. A valid body (422).

        Not idempotent: the same request twice creates two tiltak. The tiltak cannot be changed,
        completed or reopened through the API.
      security:
        - entraApplicationToken: [Procynia.Read.All, Procynia.Write.All]
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/RiskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskTreatmentActionCreate'
      responses:
        '201':
          description: The tiltak was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RiskTreatmentAction'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deviations:
    get:
      tags: [Deviations and improvements]
      operationId: listDeviations
      summary: The deviation register (avvik)
      description: |
        The avvik the integration identity may read: the customer's cases of type avvik in the
        fagområder where its roles give `improvement.view`. Improvement proposals (forbedringer)
        are not part of this endpoint: see `GET /v1/improvements`. The follow-up is computed by
        the same rules as «Trenger oppmerksomhet» in the web application.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ImprovementCaseStatusFilter'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/ImprovementCaseOverdue'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of avvik.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImprovementCase'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/deviations/{caseId}:
    get:
      tags: [Deviations and improvements]
      operationId: getDeviation
      summary: One avvik with its tiltak
      description: |
        One avvik the integration identity may read, with the fields of the register and its
        tiltak, each with its effect verification (effektverifisering). An avvik of another
        customer, outside the identity's fagområder, a forbedring, or one that does not exist is
        404.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ImprovementCaseDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/improvements:
    get:
      tags: [Deviations and improvements]
      operationId: listImprovements
      summary: The improvement proposals (forbedringer)
      description: |
        The forbedringer the integration identity may read: the customer's cases of type
        forbedring in the fagområder where its roles give `improvement.view`. The same fields,
        filters and access rule as `GET /v1/deviations`. Avvik are not part of this endpoint.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ImprovementCaseStatusFilter'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/ImprovementCaseOverdue'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of forbedringer.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImprovementCase'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/improvements/{caseId}:
    get:
      tags: [Deviations and improvements]
      operationId: getImprovement
      summary: One forbedring with its tiltak
      description: |
        One forbedring the integration identity may read, in the same fields as
        `GET /v1/deviations/{caseId}`. A forbedring of another customer, outside the identity's
        fagområder, an avvik, or one that does not exist is 404.

        Requires the Avvik og forbedringer module and `improvement.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ImprovementCaseDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/objectives:
    get:
      tags: [Objectives and KPIs]
      operationId: listObjectives
      summary: The objective register (mål)
      description: |
        The mål the integration identity may read: the customer's objectives in the fagområder
        where its roles give `objective.view`, with their KPIs counted. The counts and attention
        codes follow the same rules as the register in the web application.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: status
          in: query
          required: false
          description: Only objectives with this status.
          schema:
            $ref: '#/components/schemas/ObjectiveStatus'
        - $ref: '#/components/parameters/BusinessAreaId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of objectives.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Objective'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/objectives/{objectiveId}:
    get:
      tags: [Objectives and KPIs]
      operationId: getObjective
      summary: One objective (mål) with its KPIs
      description: |
        One objective the integration identity may read, with the fields of the register and its
        KPIs as `GET /v1/kpis` presents them. An objective of another customer, outside the
        identity's fagområder, or one that does not exist is 404.

        Not included: the process context in Kvalitet, which becomes available when Kvalitet can be
        read through the API.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ObjectiveId'
      responses:
        '200':
          description: The objective.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ObjectiveDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/kpis:
    get:
      tags: [Objectives and KPIs]
      operationId: listKpis
      summary: KPIs with their latest measured periods
      description: |
        The KPIs of the objectives the integration identity may read, and nothing else. A KPI has
        no fagområde of its own: it has its objective's. Each KPI carries its latest 24 measured
        periods. Withdrawn and superseded measurements are never included.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - name: objective_id
          in: query
          required: false
          description: Only the KPIs of this objective.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: Only KPIs with this status.
          schema:
            $ref: '#/components/schemas/KpiStatus'
        - name: business_area_id
          in: query
          required: false
          description: Only KPIs whose objective is in this fagområde. An id the caller cannot see gives an empty list.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of KPIs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kpi'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/kpis/{kpiId}/measurements:
    get:
      tags: [Objectives and KPIs]
      operationId: listKpiMeasurements
      summary: The whole measurement history (målehistorikk) of one KPI
      description: |
        Every measured period of one KPI the integration identity may read, oldest first, with the
        current measurement of each period — beyond the latest 24 that `GET /v1/kpis` carries.
        Superseded (corrected) and withdrawn measurements are never included. Each period is judged
        against the målverdi that applied when it was registered.

        The history of one KPI is returned whole, without pagination. A KPI under an objective of
        another customer or outside the identity's fagområder, or one that does not exist, is 404.

        Requires the Mål og KPI module and `objective.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/KpiId'
      responses:
        '200':
          description: The measured periods, oldest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiMeasuredPeriod'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    entraApplicationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Microsoft Entra ID v2.0 access token for the Procynia API, obtained with the OAuth 2.0
        client credentials flow (scope `<Procynia API application ID URI>/.default`). Application
        mode only. The required app roles are listed per operation: `Procynia.Read.All` for every
        route, and also `Procynia.Write.All` for write operations.

        Any failure to validate the token is 401 with `WWW-Authenticate: Bearer`, whatever the
        reason. A valid application token without the required app role, or a delegated token, is
        403.

  parameters:
    ProcyniaCustomer:
      name: Procynia-Customer
      in: header
      required: true
      description: |
        The id of the customer the request is for. It selects among the active customer grants of
        the calling client and grants nothing by itself. A missing or malformed value, a customer
        without an active grant, an inactive customer and an inactive integration identity all give
        the same 403.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,17}$'
      example: '42'
    RiskId:
      name: riskId
      in: path
      required: true
      description: The risk's id.
      schema:
        type: integer
        minimum: 0
    CaseId:
      name: caseId
      in: path
      required: true
      description: The case's id.
      schema:
        type: integer
        minimum: 0
    ImprovementCaseStatusFilter:
      name: status
      in: query
      required: false
      description: Only cases with this status.
      schema:
        $ref: '#/components/schemas/ImprovementCaseStatus'
    ImprovementCaseOverdue:
      name: overdue
      in: query
      required: false
      description: |
        `true`: only active cases (open or in progress) whose frist is before today.
        `false`: all others.
      schema:
        type: string
        enum: ['true', 'false']
    ObjectiveId:
      name: objectiveId
      in: path
      required: true
      description: The objective's id.
      schema:
        type: integer
        minimum: 0
    KpiId:
      name: kpiId
      in: path
      required: true
      description: The KPI's id.
      schema:
        type: integer
        minimum: 0
    BusinessAreaId:
      name: business_area_id
      in: query
      required: false
      description: Only records in this fagområde. An id the caller cannot see gives an empty list, not an error.
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `meta.next_cursor` from the previous page. Opaque: it carries no customer and no filter, so
        send the same filters with it. A value Procynia did not issue is 422.
      schema:
        type: string
        maxLength: 200

  headers:
    XRequestId:
      description: The request's correlation id, the same as `meta.request_id` or `error.request_id`.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: |
        No token, or a token that does not identify an accepted, enabled client application. The
        response never says which check failed.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            const: Bearer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: unauthenticated, message: Authentication is required., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    Forbidden:
      description: |
        The client is known, but this request is not one it may make: a delegated token, a missing
        app role, no active grant for the customer, a module the customer has not ordered, a
        missing permission, or a write operation not allowed for the grant. Every 403 reads the same.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: forbidden, message: The request is not permitted., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    NotFound:
      description: |
        The record does not exist or is not visible to the caller (another customer, or outside its
        fagområder). The two are indistinguishable. Also the answer for an unknown path under /api.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: not_found, message: The resource was not found., request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A }
    ValidationFailed:
      description: A query parameter or body field is invalid. `error.fields` names each one.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error:
              code: validation_failed
              message: The request is invalid.
              request_id: 01JB2Y6Q5M0Z8W3K4V7N9R2T1A
              fields:
                limit: [The limit field must not be greater than 200.]
    RateLimited:
      description: More requests than allowed per minute for this (client, customer).
      headers:
        Retry-After:
          description: Seconds until a new request is accepted.
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: An unexpected error. The response never contains the internal error message.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Microsoft Entra ID's signing keys could not be fetched, so the token could not be checked. Retry later.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Meta:
      type: object
      required: [as_of, request_id]
      additionalProperties: false
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: When the answer was computed.
        request_id:
          type: string
          description: The request's correlation id, also in `X-Request-Id`.
    PageMeta:
      type: object
      required: [as_of, request_id, limit, next_cursor]
      additionalProperties: false
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: When the answer was computed.
        request_id:
          type: string
          description: The request's correlation id, also in `X-Request-Id`.
        limit:
          type: integer
          description: The page size used.
        next_cursor:
          type: [string, 'null']
          description: Send as `cursor` for the next page. Null on the last page.

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO 8601, to the second, with a `Z` suffix.
      examples: ['2026-10-24T08:15:00Z']

    ErrorCode:
      type: string
      description: |
        A stable code per HTTP status: 400 `bad_request`, 401 `unauthenticated`, 403 `forbidden`,
        404 `not_found`, 405 `method_not_allowed`, 409 `conflict`, 422 `validation_failed`, 429
        `rate_limited`, 503 `service_unavailable`. Any other 4xx is `request_error`, any other 5xx
        `server_error`. The operations in this version can return the codes their responses list,
        plus `not_found` for an unknown path and `method_not_allowed` (with `Allow`) for a wrong
        method.
      enum: [unauthenticated, forbidden, not_found, method_not_allowed, conflict, validation_failed, rate_limited, bad_request, request_error, service_unavailable, server_error]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A fixed English sentence per code. Never the internal reason. Do not parse it; use `code`.
            request_id:
              type: string
              description: The request's correlation id, also in `X-Request-Id`. Quote it when reporting a problem.
    ValidationError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id, fields]
          additionalProperties: false
          properties:
            code:
              type: string
              const: validation_failed
            message:
              type: string
            request_id:
              type: string
            fields:
              type: object
              description: |
                Per invalid request field, its messages. The field names are stable; the messages
                are human-readable and may change.
              additionalProperties:
                type: array
                items:
                  type: string

    Reference:
      type: object
      description: A record referred to by id and name.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']
    Person:
      type: object
      description: A person (a user of the customer), by id and name.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: [string, 'null']

    Me:
      type: object
      required: [client, customer, mode, actor, modules]
      additionalProperties: false
      properties:
        client:
          type: object
          description: The calling client application as registered in Procynia.
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
        customer:
          type: object
          description: The customer selected by `Procynia-Customer`.
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
        mode:
          type: string
          const: application
          description: Application mode. Delegated mode (acting for a person) is not offered.
        actor:
          type: object
          description: The integration identity of the grant, which every request runs as.
          required: [id, name, type]
          additionalProperties: false
          properties:
            id:
              type: integer
            name:
              type: string
            type:
              type: string
              const: integration
        modules:
          type: object
          description: The modules this API serves, by the key of their endpoints.
          required: [risk, deviations, objectives]
          additionalProperties: false
          properties:
            risk:
              $ref: '#/components/schemas/ModuleAccess'
              description: Risiko — `GET /v1/risks`.
            deviations:
              $ref: '#/components/schemas/ModuleAccess'
              description: Avvik og forbedringer — `GET /v1/deviations` and `GET /v1/improvements`, which read the same module with the same permission.
            objectives:
              $ref: '#/components/schemas/ModuleAccess'
              description: Mål og KPI — `GET /v1/objectives` and `GET /v1/kpis`.
    ModuleAccess:
      type: object
      required: [entitled, readable, business_areas]
      additionalProperties: false
      properties:
        entitled:
          type: boolean
          description: The customer has ordered the module.
        readable:
          type: boolean
          description: The module is ordered and the integration identity may read it.
        business_areas:
          description: |
            The fagområder the identity reads in: `"all"` when it reaches every fagområde, otherwise
            the list. Empty when the module is not readable.
          oneOf:
            - type: string
              const: all
            - type: array
              items:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id:
                    type: integer
                  name:
                    type: string

    RiskStatus:
      type: string
      enum: [identified, in_treatment, monitored, closed]
    RiskTreatmentStrategy:
      type: string
      description: Behandlingsvalg. The chosen direction only; it is not an acceptance of the risk.
      enum: [avoid, reduce, share, accept]
    RiskLevel:
      type: string
      enum: [low, moderate, high, very_high]
    RiskAttentionCode:
      type: string
      description: |
        Why a risk that is not closed needs attention, in this order: high or very high residual
        risk, never assessed, the latest assessment has no residual risk, the periodic review is
        overdue, the acceptance of residual risk has expired, a tiltak is past its frist.
      enum: [high_residual, not_assessed, residual_not_assessed, review_overdue, acceptance_expired, actions_overdue]
    RiskScore:
      type: object
      description: |
        Likelihood and consequence on a 1–5 scale, score = likelihood × consequence, and the level
        by score band (1–4 low, 5–9 moderate, 10–16 high, 17–25 very high).
      required: [likelihood, consequence, score, level]
      additionalProperties: false
      properties:
        likelihood:
          type: integer
          minimum: 1
          maximum: 5
        consequence:
          type: integer
          minimum: 1
          maximum: 5
        score:
          type: integer
          minimum: 1
          maximum: 25
        level:
          $ref: '#/components/schemas/RiskLevel'
    Risk:
      description: |
        A risk, structured fields only. Not included: årsak, hendelse, konsekvens, utfyllende
        informasjon, begrunnelser and other free text.
      allOf:
        - $ref: '#/components/schemas/RiskFields'
      unevaluatedProperties: false
    RiskFields:
      type: object
      description: The fields of a risk in the register, shared by Risk and RiskDetail.
      required: [id, title, status, treatment_strategy, business_area, owner, inherent, residual, last_assessed_on, review_interval_months, next_review_on, is_review_overdue, attention, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskStatus'
        treatment_strategy:
          description: Null when no behandlingsvalg has been made.
          oneOf:
            - $ref: '#/components/schemas/RiskTreatmentStrategy'
            - type: 'null'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The risk's fagområde.
        owner:
          description: The risk owner, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        inherent:
          description: Inherent risk from the latest assessment. Null when the risk has never been assessed.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
        residual:
          description: Residual risk from the latest assessment. Null when that assessment has no residual risk, or the risk has never been assessed.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
        last_assessed_on:
          type: [string, 'null']
          format: date
          description: The date of the latest assessment.
        review_interval_months:
          description: The periodic review interval, or null for no fixed cycle.
          oneOf:
            - type: integer
              enum: [1, 3, 6, 12]
            - type: 'null'
        next_review_on:
          type: [string, 'null']
          format: date
          description: When the next periodic review is due.
        is_review_overdue:
          type: boolean
        attention:
          type: array
          description: Empty for a closed risk.
          items:
            $ref: '#/components/schemas/RiskAttentionCode'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    RiskDetail:
      description: |
        A risk with its history and follow-up. Not included: rationales, tiltak results, who
        assessed, accepted or revoked, and the Kvalitet links.
      allOf:
        - $ref: '#/components/schemas/RiskFields'
        - type: object
          required: [assessments, treatment_actions, acceptance]
          properties:
            assessments:
              type: array
              description: Every assessment, newest first.
              items:
                $ref: '#/components/schemas/RiskAssessment'
            treatment_actions:
              type: array
              description: Open tiltak by frist first, then completed ones, most recently completed first.
              items:
                $ref: '#/components/schemas/RiskTreatmentActionRow'
            acceptance:
              type: object
              description: The acceptance of residual risk.
              required: [current, history]
              additionalProperties: false
              properties:
                current:
                  description: The acceptance of the latest assessment that is not revoked, or null.
                  oneOf:
                    - $ref: '#/components/schemas/RiskAcceptance'
                    - type: 'null'
                history:
                  type: array
                  description: Earlier and revoked acceptances, newest first.
                  items:
                    $ref: '#/components/schemas/RiskAcceptance'
      unevaluatedProperties: false
    RiskAssessment:
      type: object
      required: [id, assessed_at, inherent, residual]
      additionalProperties: false
      properties:
        id:
          type: integer
        assessed_at:
          $ref: '#/components/schemas/Timestamp'
        inherent:
          $ref: '#/components/schemas/RiskScore'
        residual:
          description: Null when the assessment has no residual risk.
          oneOf:
            - $ref: '#/components/schemas/RiskScore'
            - type: 'null'
    RiskTreatmentActionRowStatus:
      type: string
      enum: [open, completed]
    RiskTreatmentActionRow:
      type: object
      required: [id, title, status, owner, due_at, completed_at, is_overdue]
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskTreatmentActionRowStatus'
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_at:
          type: [string, 'null']
          format: date
          description: The frist.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        is_overdue:
          type: boolean
          description: Open, and the frist is before today.
    RiskAcceptanceState:
      type: string
      description: current, superseded (accepted for an assessment that is no longer the latest), or revoked.
      enum: [current, superseded, revoked]
    RiskAcceptance:
      type: object
      required: [id, assessment_id, state, accepted_at, valid_until, is_expired, revoked_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        assessment_id:
          type: integer
          description: The assessment whose residual risk was accepted.
        state:
          $ref: '#/components/schemas/RiskAcceptanceState'
        accepted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        valid_until:
          type: [string, 'null']
          format: date
        is_expired:
          type: boolean
          description: valid_until is before today.
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    RiskTreatmentActionCreate:
      type: object
      description: |
        The only fields accepted. Any other field (for example `status` or `outcome_note`) is
        ignored and never written.
      required: [title, owner_user_id, due_at]
      properties:
        title:
          type: string
          maxLength: 255
          description: Leading and trailing whitespace is removed.
        owner_user_id:
          type: integer
          description: |
            The responsible person: an active user of the same customer who can read this risk
            (`risk.view` in its fagområde). Not the integration identity. Anyone else is 422.
        due_at:
          type: string
          format: date
          description: The deadline, `YYYY-MM-DD`.
      example:
        title: Reservestrøm i serverrommet
        owner_user_id: 1234
        due_at: '2026-12-01'
    RiskTreatmentActionStatus:
      type: string
      description: A tiltak created through the API is always open.
      enum: [open]
    RiskTreatmentAction:
      type: object
      required: [id, risk_id, title, status, owner, due_at, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        risk_id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/RiskTreatmentActionStatus'
        owner:
          description: The responsible person.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_at:
          type: string
          format: date
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ImprovementCaseStatus:
      type: string
      description: open and in_progress are active; closed and cancelled have ended.
      enum: [open, in_progress, closed, cancelled]
    ImprovementAttentionCode:
      type: string
      description: |
        Why an active case needs attention, in this order: its frist has passed, a tiltak's frist
        has passed, it has no responsible person, an active tiltak has no responsible person, a
        completed tiltak awaits effect verification, a tiltak was verified as not effective.
      enum: [case_overdue, action_overdue, case_owner_missing, action_owner_missing, awaiting_verification, not_effective]
    ImprovementCase:
      description: |
        An avvik or a forbedring, structured fields only. Not included: beskrivelse,
        årsaksanalyse, avslutningsnotat and other free text, the reporter, who closed it, tiltak
        titles and documents.
      allOf:
        - $ref: '#/components/schemas/ImprovementCaseFields'
      unevaluatedProperties: false
    ImprovementCaseFields:
      type: object
      description: The fields of a case in the register, shared by ImprovementCase and ImprovementCaseDetail.
      required: [id, title, status, business_area, owner, occurred_on, due_on, is_overdue, closed_at, follow_up, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
          description: Written by people. May contain personal data, in avvik most of all.
        status:
          $ref: '#/components/schemas/ImprovementCaseStatus'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The case's fagområde.
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        occurred_on:
          type: [string, 'null']
          format: date
          description: When it happened (hendelsesdato).
        due_on:
          type: [string, 'null']
          format: date
          description: The frist.
        is_overdue:
          type: boolean
          description: Active, and the frist is before today.
        closed_at:
          description: When it was closed or cancelled.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        follow_up:
          type: object
          required: [actions_total, actions_open, attention]
          additionalProperties: false
          properties:
            actions_total:
              type: integer
              description: All tiltak on the case.
            actions_open:
              type: integer
              description: Tiltak still being worked on (planned or in progress).
            attention:
              type: array
              description: Empty unless the case is active.
              items:
                $ref: '#/components/schemas/ImprovementAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ImprovementCaseDetail:
      description: |
        A case with its tiltak. Not included: tiltak descriptions and completion notes,
        verification notes, who completed or verified, the status history, the Kvalitet links and
        the origin in other modules.
      allOf:
        - $ref: '#/components/schemas/ImprovementCaseFields'
        - type: object
          required: [actions]
          properties:
            actions:
              type: array
              description: The tiltak, in the order they were added.
              items:
                $ref: '#/components/schemas/ImprovementAction'
      unevaluatedProperties: false
    ImprovementActionStatus:
      type: string
      description: planned and in_progress are active; completed and cancelled have ended.
      enum: [planned, in_progress, completed, cancelled]
    ImprovementActionVerificationResult:
      type: string
      enum: [effective, not_effective]
    ImprovementAction:
      type: object
      required: [id, title, status, owner, due_on, is_overdue, completed_at, verification]
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
          description: Written by people. May contain personal data.
        status:
          $ref: '#/components/schemas/ImprovementActionStatus'
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        due_on:
          type: [string, 'null']
          format: date
          description: The frist.
        is_overdue:
          type: boolean
          description: The case is active, the tiltak is active, and its frist is before today.
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        verification:
          type: object
          description: The effect verification (effektverifisering) of a completed tiltak.
          required: [awaiting, current, earlier]
          additionalProperties: false
          properties:
            awaiting:
              type: boolean
              description: Completed, and the current completion is not yet verified.
            current:
              description: The verification of the current completion, or null.
              oneOf:
                - $ref: '#/components/schemas/ImprovementActionVerification'
                - type: 'null'
            earlier:
              type: array
              description: Other verifications, newest first — of earlier completions that were later reopened.
              items:
                $ref: '#/components/schemas/ImprovementActionVerification'
    ImprovementActionVerification:
      type: object
      required: [id, result, verified_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        result:
          $ref: '#/components/schemas/ImprovementActionVerificationResult'
        verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ObjectiveStatus:
      type: string
      description: active, or closed as achieved, not_achieved or cancelled.
      enum: [active, achieved, not_achieved, cancelled]
    ObjectiveAttentionCode:
      type: string
      description: The objective's own reasons. A KPI's reasons are counted in `kpis.needing_attention`, never listed here.
      enum: [target_date_passed, owner_missing]
    Objective:
      description: |
        A mål, structured fields only. Not included: beskrivelse, avslutningsnotat, who closed it,
        the status history and the process context.
      allOf:
        - $ref: '#/components/schemas/ObjectiveFields'
      unevaluatedProperties: false
    ObjectiveDetail:
      description: A mål with its KPIs.
      allOf:
        - $ref: '#/components/schemas/ObjectiveFields'
        - type: object
          required: [kpi_list]
          properties:
            kpi_list:
              type: array
              description: Its KPIs, by id, as `GET /v1/kpis` presents them.
              items:
                $ref: '#/components/schemas/Kpi'
      unevaluatedProperties: false
    ObjectiveFields:
      type: object
      description: The fields of a mål in the register, shared by Objective and ObjectiveDetail.
      required: [id, title, status, business_area, owner, target_date, closed_at, kpis, attention, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/ObjectiveStatus'
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The objective's fagområde.
        owner:
          description: The responsible person, or null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        target_date:
          type: [string, 'null']
          format: date
          description: Måldato.
        closed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        kpis:
          type: object
          required: [total, active, on_target, needing_attention]
          additionalProperties: false
          properties:
            total:
              type: integer
              description: All KPIs, retired ones included.
            active:
              type: integer
              description: Active KPIs.
            on_target:
              type: integer
              description: Active KPIs whose latest measurement is on target against today's målverdi.
            needing_attention:
              type: integer
              description: Active KPIs with at least one `KpiAttentionCode`.
        attention:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    KpiStatus:
      type: string
      enum: [active, retired]
    KpiUnit:
      type: string
      description: percent is a share (0–100); percent_change may be negative or above 100.
      enum: [percent, percent_change, count, number, currency, hours, days]
    KpiFrequency:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    KpiTargetType:
      type: string
      description: at_least (min only), at_most (max only), range (min and max), exact (min equals max).
      enum: [at_least, at_most, range, exact]
    KpiResult:
      type: string
      description: On target, within the tolerance (attention), or off target.
      enum: [on_target, attention, off_target]
    KpiCurrentResult:
      type: string
      description: The KPI's result now. `not_measured` when it has no measurement.
      enum: [on_target, attention, off_target, not_measured]
    KpiAttentionCode:
      type: string
      description: The latest measurement is not on target; a measurement is missing for a period that is due.
      enum: [kpi_off_target, measurement_missing]
    Decimal:
      type: string
      description: An exact decimal number as a string, without trailing zeros and without language formatting, for example `99.5` or `-3`.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['99.5']
    KpiMeasurement:
      type: object
      required: [period_start, period_end, value, recorded_at]
      additionalProperties: false
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/Decimal'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
    KpiMeasuredPeriod:
      type: object
      required: [period_start, period_end, value, recorded_at, result]
      additionalProperties: false
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/Decimal'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        result:
          $ref: '#/components/schemas/KpiResult'
          description: Against the målverdi that applied when the measurement was registered, not today's.
    Kpi:
      type: object
      description: |
        A KPI, structured fields only. Not included: beskrivelse, measurement comments, who
        registered or withdrew a measurement, withdrawal reasons, withdrawn and superseded
        measurements, and the process context.
      required: [id, objective_id, business_area, title, status, owner, unit, unit_label, currency_code, target, baseline, frequency, reporting_grace_days, latest_measurement, result, measurements, attention, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        objective_id:
          type: integer
        business_area:
          $ref: '#/components/schemas/Reference'
          description: The objective's fagområde.
        title:
          type: string
        status:
          $ref: '#/components/schemas/KpiStatus'
        owner:
          description: The KPI's own responsible person, or else the objective's (`inherited` true). Null when neither has one.
          oneOf:
            - type: object
              required: [id, name, inherited]
              additionalProperties: false
              properties:
                id:
                  type: integer
                name:
                  type: string
                inherited:
                  type: boolean
            - type: 'null'
        unit:
          $ref: '#/components/schemas/KpiUnit'
        unit_label:
          type: [string, 'null']
          description: A free label for count and number (for example «saker»). Null otherwise.
        currency_code:
          type: [string, 'null']
          description: Set for currency only, for example `NOK`.
        target:
          type: object
          description: The målverdi now. At least one of min and max is set.
          required: [type, min, max, tolerance]
          additionalProperties: false
          properties:
            type:
              $ref: '#/components/schemas/KpiTargetType'
            min:
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
            max:
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
            tolerance:
              description: The margin outside the target that counts as attention rather than off target.
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
        baseline:
          description: Startverdi, when the målverdi was set as change from a starting level.
          oneOf:
            - type: object
              required: [value, date]
              additionalProperties: false
              properties:
                value:
                  $ref: '#/components/schemas/Decimal'
                date:
                  type: [string, 'null']
                  format: date
            - type: 'null'
        frequency:
          description: The measuring frequency, or null for no fixed frequency.
          oneOf:
            - $ref: '#/components/schemas/KpiFrequency'
            - type: 'null'
        reporting_grace_days:
          type: integer
          minimum: 0
          description: Days after a period ends before its missing measurement counts as missing.
        latest_measurement:
          description: The latest current measurement, or null.
          oneOf:
            - $ref: '#/components/schemas/KpiMeasurement'
            - type: 'null'
        result:
          $ref: '#/components/schemas/KpiCurrentResult'
          description: The latest measurement against today's målverdi.
        measurements:
          type: array
          maxItems: 24
          description: The latest 24 measured periods, oldest first, one current measurement per period. The whole history is `GET /v1/kpis/{kpiId}/measurements`.
          items:
            $ref: '#/components/schemas/KpiMeasuredPeriod'
        attention:
          type: array
          description: Only active KPIs under active objectives have codes.
          items:
            $ref: '#/components/schemas/KpiAttentionCode'
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
