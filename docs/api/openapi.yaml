      operationId: listManagementReviews
      summary: Ledelsens gjennomganger
      description: |
        The management reviews the integration identity may read: every review of the customer,
        when the customer has the module and the identity has `management_review.view`. A review
        is customer-wide; its fagområder narrow what its basis covers, never who may read it.

        Requires the Ledelsens gjennomgang module and `management_review.view`.
      parameters:
        - $ref: '#/components/parameters/ProcyniaCustomer'
        - $ref: '#/components/parameters/ManagementReviewStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of reviews.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
