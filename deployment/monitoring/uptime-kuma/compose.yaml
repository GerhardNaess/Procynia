services:
    uptime-kuma:
        image: louislam/uptime-kuma:2
        container_name: procynia-uptime-kuma
        restart: unless-stopped
        ports:
            - "127.0.0.1:3001:3001"
        volumes:
            - uptime-kuma-data:/app/data
        environment:
            TZ: ${TZ:-Europe/Oslo}
        healthcheck:
            test: >
                node -e "const http=require('http'); const req=http.get('http://localhost:3001', (res) => { process.exit(res.statusCode && res.statusCode < 500 ? 0 : 1); }); req.on('error', () => process.exit(1));"
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    uptime-kuma-data:
